name: Deploy Storage Rules

on:
  push:
    branches:
      - main
    paths:
      - "storage.rules"
      - "firebase.json"
  # Manual trigger so the operator can deploy on demand after granting the
  # cross-service approval, without pushing a new commit.
  workflow_dispatch:

jobs:
  # Evidence gate: run the storage rules suite (firestore + storage emulators)
  # before any deploy. The cross-service freeze matrix self-skips where the
  # runner can't do cross-service reads; the posture tests always run.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Run storage rules tests
        env:
          REQUIRE_STORAGE_EMULATOR: "1"
          REQUIRE_FIRESTORE_EMULATOR: "1"
        run: npm run test:rules:storage

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # ── PACKET 11 DEPLOY GATE ────────────────────────────────────────────
    # storage.rules now reads Firestore (the account-deletion write freeze).
    # Cross-service access requires a ONE-TIME interactive approval in the
    # Firebase Console by a project owner. Deploying the cross-service rule
    # BEFORE that approval exists makes the freeze predicate error → deny →
    # ALL photo uploads blocked app-wide. So this deploy job is gated: it
    # stays skipped until an operator sets the repo variable
    # STORAGE_XSERVICE_APPROVED=true (Settings → Secrets and variables →
    # Actions → Variables) AFTER granting cross-service access. Equivalently
    # the operator can run `firebase deploy --only storage
    # --project adaptive-fitness-af8bb` by hand for the first deploy. Once
    # the variable is set, subsequent storage.rules pushes deploy normally.
    if: vars.STORAGE_XSERVICE_APPROVED == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project adaptive-fitness-af8bb --force

  # ── LOUD SKIP ────────────────────────────────────────────────────────────
  # The gate above is intentional, but a skipped job leaves the WORKFLOW
  # green — and this workflow only ever triggers when storage.rules or
  # firebase.json actually changed. So every gated run is, by construction,
  # "a rules change that did not ship", reported as success. That is the
  # same silent-drift shape the Cloud Functions dedup gotcha caused (see
  # CLAUDE.md, "Cloud Functions deploy — known gotchas"): CI green read as
  # deployed while production stayed on the old bundle for days.
  #
  # This job fails so the drift is legible at a glance. It is not noise:
  # it cannot fire in steady state (no rules change → no workflow run), it
  # names the exact remediation, and it disappears the moment the operator
  # completes the packet-11 rollout. `verify` still runs and still gates,
  # so the rules themselves are tested either way.
  report-not-deployed:
    needs: verify
    if: vars.STORAGE_XSERVICE_APPROVED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Storage rules changed but were NOT deployed
        run: |
          {
            echo "## ⚠️ storage.rules changed — NOT deployed"
            echo
            echo "The \`deploy\` job is gated behind the repo variable"
            echo "\`STORAGE_XSERVICE_APPROVED\`, which is not set to \`true\`."
            echo "Production Storage rules are unchanged by this run."
            echo
            echo "This gate exists because \`storage.rules\` reads Firestore"
            echo "(the account-deletion write freeze). Deploying that"
            echo "cross-service rule before a project owner grants access in"
            echo "the Firebase Console makes the predicate error → deny →"
            echo "**all photo uploads blocked app-wide**."
            echo
            echo "To ship these rules:"
            echo
            echo '1. From a project-owner machine, run:'
            echo '   `firebase deploy --only storage --project adaptive-fitness-af8bb`'
            echo '   and approve the cross-service prompt. This is the ONLY'
            echo '   path while the gate is off — re-running this workflow via'
            echo '   `workflow_dispatch` hits the same `if:` and skips again.'
            echo '2. Then set repo variable `STORAGE_XSERVICE_APPROVED=true`'
            echo '   (Settings → Secrets and variables → Actions → Variables)'
            echo '   so subsequent pushes deploy normally.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=storage.rules not deployed::Gated behind STORAGE_XSERVICE_APPROVED; see the job summary for the rollout steps."
          exit 1
