name: Deploy Storage Rules

on:
  push:
    branches:
      - main
    paths:
      - "storage.rules"
      - "firebase.json"
  # Manual trigger so the operator can deploy on demand after granting the
  # cross-service approval, without pushing a new commit.
  workflow_dispatch:

jobs:
  # Evidence gate: run the storage rules suite (firestore + storage emulators)
  # before any deploy. The cross-service freeze matrix self-skips where the
  # runner can't do cross-service reads; the posture tests always run.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Run storage rules tests
        env:
          REQUIRE_STORAGE_EMULATOR: "1"
          REQUIRE_FIRESTORE_EMULATOR: "1"
        run: npm run test:rules:storage

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # ── PACKET 11 DEPLOY GATE ────────────────────────────────────────────
    # storage.rules now reads Firestore (the account-deletion write freeze).
    # Cross-service access requires a ONE-TIME interactive approval in the
    # Firebase Console by a project owner. Deploying the cross-service rule
    # BEFORE that approval exists makes the freeze predicate error → deny →
    # ALL photo uploads blocked app-wide. So this deploy job is gated: it
    # stays skipped until an operator sets the repo variable
    # STORAGE_XSERVICE_APPROVED=true (Settings → Secrets and variables →
    # Actions → Variables) AFTER granting cross-service access. Equivalently
    # the operator can run `firebase deploy --only storage
    # --project adaptive-fitness-af8bb` by hand for the first deploy. Once
    # the variable is set, subsequent storage.rules pushes deploy normally.
    if: vars.STORAGE_XSERVICE_APPROVED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project adaptive-fitness-af8bb --force
