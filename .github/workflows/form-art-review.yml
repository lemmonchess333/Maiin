name: Form artwork review

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/exercise-art/**"
      - "src/components/ExerciseFormFrames.tsx"
      - "e2e/fixtures/form-art.tsx"
      - "e2e/form-art-review.pw.ts"
      - "playwright.form-art.config.ts"
      - "scripts/export-form-art-review.py"
      - ".github/workflows/form-art-review.yml"

permissions:
  contents: read

concurrency:
  group: form-art-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and package selected original frames
        run: python3 scripts/export-form-art-review.py --output art-review-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: form-art-sources
          path: art-review-output/
          if-no-files-found: error
          retention-days: 14

  review-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the account-free review fixture
        run: npx tsc -p e2e/fixtures/tsconfig.form-art.json
      - name: Install test browser
        # A stalled apt mirror hangs apt-get with no error, and on 2026-10-07
        # that cost two whole jobs (14.5 and 30 min) before a test ran. Each
        # attempt gets a bound; `timeout` kills the whole process group, and
        # `dpkg --configure -a` repairs a dpkg it interrupted mid-install.
        timeout-minutes: 11
        run: |
          for i in 1 2 3; do
            timeout --kill-after=10 200 npx playwright install --with-deps chromium && exit 0
            echo "::warning::'npx playwright install --with-deps chromium' attempt $i failed or stalled; retrying"
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1
      - name: Capture all frames and verify real player behavior
        run: npx playwright test --config playwright.form-art.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: form-art-playback
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
