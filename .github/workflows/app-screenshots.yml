name: App Screenshots

# On-demand app screenshots for design review. The agent sandbox can't run a
# browser (Playwright's CDN is off the egress allowlist), so this captures the
# app in CI and COMMITS the PNGs to the `app-screenshots` branch — which the
# agent can `git fetch` and view. Push to `claude/screenshot-app` to run it.

on:
  push:
    branches: ["claude/screenshot-app"]
  workflow_dispatch:

# D26 (2026-08-22): two concurrent runs race on the app-screenshots branch —
# both force-push frames there while each diffs against whatever the branch
# held when it STARTED, so the loser's frames vanish and the winner's diff
# report can be computed off the loser's output instead of the intended
# baseline (observed with b9fce05/d2f130c overlapping by four minutes). A
# report off the wrong baseline doesn't look wrong; it looks like a change
# you didn't make — the same instrument-lies class as D22. Cancelling the
# superseded run discards nothing of value: its frames would be overwritten
# by the newer force-push anyway, and its report is exactly the artifact the
# race corrupts. Anyone wanting sequential A-vs-B reports must wait for A's
# run regardless (the second-diff rule), which this does not change.
concurrency:
  group: app-screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # The 31 October full run hit the old 30-minute limit during capture,
    # leaving only a partial review artifact. Allow capture, diff and the
    # baseline update to finish before treating a run as a visual baseline.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - run: npm ci
      # The running-coaching capture calls the real server command handler.
      - run: npm ci --prefix functions

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # A stalled apt mirror hangs apt-get with no error. The script bounds
        # each attempt, tries three times, and clears dpkg's lock between
        # attempts; this limit covers its worst case.
        timeout-minutes: 13
        run: bash scripts/ci/install-playwright-chromium.sh install 200
      - name: Install Chromium deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # Bounded and retried for the same reason as the step above.
        timeout-minutes: 10
        run: bash scripts/ci/install-playwright-chromium.sh install-deps 140

      - run: npm install -g firebase-tools@15.34.0

      - name: Build app with emulator wiring
        run: npm run build:e2e
        env:
          VITE_USE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-dummy-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-tropos.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-tropos
          VITE_FIREBASE_STORAGE_BUCKET: demo-tropos.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

      - name: Capture screenshots
        id: capture
        env:
          E2E_AUTH_EMULATOR: "1"
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-tropos
        run: |
          firebase emulators:exec --only auth,firestore --project demo-tropos \
            'npm run seed:e2e && npm run seed:rich && npm run seed:circles && npm run seed:experience && npm run seed:fellbehind && npm run seed:liftreturn && npm run seed:season && npm run test:e2e -- capture.spec.ts --project=auth-emulator'

      - name: Diff against the previous capture
        if: always()
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "no screenshots produced — skipping diff"; exit 0
          fi
          # Previous capture = the current app-screenshots branch content.
          # First run (no branch yet) diffs against an empty baseline and
          # reports every frame as added.
          rm -rf baseline-screenshots screenshot-diff
          if git fetch origin app-screenshots --depth 1 2>/dev/null; then
            git worktree add --detach baseline-worktree FETCH_HEAD
            [ -d baseline-worktree/screenshots ] && mv baseline-worktree/screenshots baseline-screenshots
            git worktree remove --force baseline-worktree || true
          fi
          mkdir -p baseline-screenshots
          node scripts/diff-screenshots.mjs baseline-screenshots screenshots screenshot-diff
          # A truncated run reaches here too (this step is `always()`), and
          # its report is actively misleading: every frame whose spec never
          # ran is listed as "removed". Say so at the top rather than
          # leaving a reader to infer it from the check's conclusion.
          if [ "${{ steps.capture.outcome }}" != "success" ]; then
            printf '%s\n' \
              "> **INCOMPLETE CAPTURE** — the capture step ended in \`${{ steps.capture.outcome }}\`," \
              "> so specs that never ran contribute no frames. Any \"removed\" row below" \
              "> is most likely a frame this run did not reach, NOT a deleted surface." \
              "" | cat - screenshot-diff/DIFF_REPORT.md > screenshot-diff/DIFF_REPORT.md.tmp
            mv screenshot-diff/DIFF_REPORT.md.tmp screenshot-diff/DIFF_REPORT.md
          fi
          cat screenshot-diff/DIFF_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Preserve screenshots from a failed run for review
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-screenshots-review
          path: |
            screenshots/
            screenshot-diff/
          if-no-files-found: ignore
          retention-days: 7

      # Keep the last complete baseline when capture, diff or the run fails.
      # Partial frames remain available in the review artifact above.
      - name: Commit screenshots to the app-screenshots branch
        if: success() && steps.capture.outcome == 'success'
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "no screenshots produced"; exit 0
          fi
          git config user.name "tropos-screenshot-bot"
          git config user.email "bot@tropos.local"
          git checkout -B app-screenshots
          git add -f screenshots/
          # The delta rides along: DIFF_REPORT.md + per-frame changed-pixel
          # highlights, so a fetch of the branch carries the review artifact
          # (also mirrored into the run's step summary above).
          [ -d screenshot-diff ] && git add -f screenshot-diff/
          git commit -m "chore: app screenshots [skip ci]" || { echo "no changes"; exit 0; }
          git push -f origin app-screenshots
