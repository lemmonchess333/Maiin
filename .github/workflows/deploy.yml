name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Cancel the in-progress deploy when a new commit lands on main.
  # GitHub Pages only allows one active deployment per environment;
  # the `pages` concurrency group enforces that at the Actions
  # layer. We tried `cancel-in-progress: false` to queue deploys
  # (so every commit's bundle would visibly publish in order) but
  # the Pages API rejected queued deployments with intermittent
  # 401 "Bad credentials" errors — the queued OIDC tokens
  # apparently don't survive the wait between job start and the
  # Pages API call.
  #
  # Cancelling is the right behaviour for Pages: production always
  # reflects the latest main commit, which is what users see. The
  # cancelled interim runs are a UI artefact, not a real loss.
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # FCM Web push public VAPID key (#963). Public by design (ships in the
          # client bundle); kept as a secret only to match the other VITE_ vars.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      # Defence in depth: refuse to deploy a build that contains the
      # E2E marker. The marker is emitted as a top-of-bundle banner
      # only by `npm run build:e2e` (vite.config.ts function-form,
      # `--mode=test`). A normal `npm run build` produces no banner,
      # so this step is a no-op on the happy path and a hard halt
      # if someone wires the wrong script into the deploy job.
      - name: Refuse to deploy E2E test build
        run: |
          if grep -R "TROPOS_E2E_BUILD_DO_NOT_DEPLOY" dist/; then
            echo "::error::dist/ contains E2E test build marker — refusing to deploy."
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5
