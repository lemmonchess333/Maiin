name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Cancel the in-progress deploy when a new commit lands on main.
  # GitHub Pages only allows one active deployment per environment;
  # the `pages` concurrency group enforces that at the Actions
  # layer. We tried `cancel-in-progress: false` to queue deploys
  # (so every commit's bundle would visibly publish in order) but
  # the Pages API rejected queued deployments with intermittent
  # 401 "Bad credentials" errors — the queued OIDC tokens
  # apparently don't survive the wait between job start and the
  # Pages API call.
  #
  # Cancelling is the right behaviour for Pages: production always
  # reflects the latest main commit, which is what users see. The
  # cancelled interim runs are a UI artefact, not a real loss.
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run check:form-art
      - run: npm run test -- --run
      # Guard: fail the deploy if the Firebase web config secrets are unset,
      # rather than shipping a blank config where every sign-in returns
      # auth/internal-error. Same env block as the build below.
      - run: node scripts/check-web-env.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Firebase Analytics measurement ID (G-XXXXXXXXXX). Web-only: the
          # web Analytics SDK reads this; native iOS uses GoogleService-Info.plist.
          # Unset → analytics layer stays a no-op (analyticsProvider.ts gating).
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # FCM Web push public VAPID key (#963). Public by design (ships in the
          # client bundle); kept as a secret only to match the other VITE_ vars.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Run11 road-aware route planning — enables the Pro-gated Mapbox
          # road-align / loop layer in RoutePlannerSheet (routePlanningApi.ts
          # gates on this). The `planRunningRoute` callable + its
          # MAPBOX_DIRECTIONS_TOKEN secret are live in production (2026-07-18).
          # Non-secret public flag; the road buttons only render for Pro users.
          VITE_ROUTE_PLANNING_ENABLED: "true"
      # Defence in depth: refuse to deploy a build that contains the
      # E2E marker. The marker is emitted as a top-of-bundle banner
      # only by `npm run build:e2e` (vite.config.ts function-form,
      # `--mode=test`). A normal `npm run build` produces no banner,
      # so this step is a no-op on the happy path and a hard halt
      # if someone wires the wrong script into the deploy job.
      - name: Refuse to deploy E2E test build
        run: |
          if grep -R "TROPOS_E2E_BUILD_DO_NOT_DEPLOY" dist/; then
            echo "::error::dist/ contains E2E test build marker — refusing to deploy."
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
