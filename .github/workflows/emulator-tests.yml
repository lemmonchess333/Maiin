name: Firebase Emulator Tests

# Runs the suites that need the Firebase Auth + Firestore emulators:
#   - firestore.rules.test.ts (PR K)            via `npm run test:rules`
#   - functions/__tests__/integration*.test.js  via `npm test --prefix functions`
#   - e2e/auth.spec.ts (PR P)                   via `npm run test:e2e`
#
# These suites all skip gracefully when emulator env vars are unset
# (matching the firestore.rules.test.ts pattern). This workflow boots
# the emulators once and runs all three against the same instance so
# CI cost stays bounded.

on:
  push:
    # Fires on main AND on any feature branch starting with
    # `claude/` so workflow changes can be validated before they
    # merge. Without the feature-branch trigger, every workflow
    # fix has to ride a separate merge cycle to even run, which
    # turns debugging into a guessing game.
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: ['main']
  # Manual trigger so the workflow can be re-run on demand
  # without pushing an empty commit.
  workflow_dispatch:

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      # Firebase emulators run on the JVM. Java 21+ is required by
      # firebase-tools (the CLI errors out hard on JDK <21 since the
      # 14.x release line). The hosted runner ships Java 17 by
      # default (JAVA_HOME_17_X64 stays preset on the image even
      # after we install Java 21); setup-java@v4 with java-version
      # '21' repoints JAVA_HOME + PATH at the 21 install.
      #
      # Quoted as a string because YAML parses bare `21` as int and
      # some action versions are finicky about the type — the docs
      # canonically show quoted strings.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      # Debug — surfaces in the run log so a future "why is Java
      # 17 again" can be diagnosed in one click rather than
      # bisecting workflow files.
      - name: Verify Java version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - run: npm ci
      - run: npm ci --prefix functions

      # Cache Playwright browsers. The WebKit apt-deps install pulls
      # in ~360MB of GStreamer + Wayland packages and was eating
      # ~12 of the 15 minute job budget. The cache key includes the
      # Playwright dep version so a bump invalidates the cache cleanly.
      - name: Get Playwright version
        id: playwright-version
        run: |
          PW_VERSION=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Auth E2E only runs chromium — the mobile (WebKit) project
      # doubles runtime for no extra coverage at this stage, and
      # WebKit's apt-deps install is what was timing the workflow
      # out. Local runs can still run both via `npm run test:e2e`.
      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Firebase CLI provides the emulator binaries. Install globally
      # so subsequent `firebase emulators:exec` invocations resolve it.
      - run: npm install -g firebase-tools

      # Build the app pointed at the local emulator. VITE_USE_EMULATORS
      # toggles connectAuthEmulator / connectFirestoreEmulator in
      # src/lib/firebase.ts so the served SPA talks to the emulators
      # rather than the (absent) production Firebase project.
      #
      # This intentionally keeps index.html's production CSP intact.
      # Playwright's auth-emulator browser context uses bypassCSP so
      # test-only localhost Firebase traffic works without introducing
      # a Vite plugin that strips or mutates CSP in build output.
      #
      # The VITE_FIREBASE_* values are intentional placeholders —
      # `connectAuthEmulator` reroutes the network calls to
      # 127.0.0.1:9099 regardless, but Firebase's auth client refuses
      # to initialise (and `onAuthStateChanged` never fires its
      # initial callback) when apiKey / authDomain / projectId are
      # empty strings. That leaves the SPA stuck on the "Loading
      # Tropos" spinner forever and the Login form never renders for
      # Playwright to drive — which was exactly the 11:46/11:47
      # timeout symptom. Project-ID matches the `--project=demo-tropos`
      # passed to firebase emulators:exec so the emulator routing
      # is internally consistent.
      - name: Build app with emulator wiring
        run: npm run build:e2e
        env:
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_API_KEY: emulator-dummy-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-tropos.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-tropos
          VITE_FIREBASE_STORAGE_BUCKET: demo-tropos.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'

      # ── Suite 1: Firestore rules tests
      # Uses the firebase emulators:exec wrapper which boots the
      # emulator, runs the command, then tears it down. Project ID
      # matches the suite's `PROJECT_ID` constants.
      - name: Run firestore.rules tests
        run: npm run test:rules

      # ── Suite 2: Functions integration tests
      # Boots Auth + Firestore emulators, exports the host env vars,
      # then runs the functions vitest suite. The integration tests
      # check FIRESTORE_EMULATOR_HOST themselves and skip when unset.
      - name: Run functions integration tests
        run: |
          firebase emulators:exec --only auth,firestore --project demo-tropos \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 GCLOUD_PROJECT=demo-tropos npm test --prefix functions'

      # ── Suite 3: Authenticated E2E (chromium only in CI)
      # Seeds the test user against the emulator, then runs
      # auth.spec.ts (gated on E2E_AUTH_EMULATOR). Scoped via
      # --project=auth-emulator so only that project's bypassCSP
      # context runs; the default chromium + mobile projects
      # testIgnore auth.spec.ts. Local developers can still run
      # `npm run test:e2e` for the full matrix. Playwright boots
      # its own preview server via webServer in playwright.config.ts.
      #
      # All four env vars are step-scoped so both seed:e2e and
      # Playwright inherit the same strict emulator configuration.
      # Do not inline only part of the env before one command; that
      # caused seed:e2e to fail with E2E_AUTH_EMULATOR unset (the
      # shared e2e/helpers/emulator gate refused to run, by design).
      - name: Run authenticated E2E
        env:
          E2E_AUTH_EMULATOR: '1'
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-tropos
        run: |
          firebase emulators:exec --only auth,firestore --project demo-tropos \
            'npm run seed:e2e && npm run test:e2e -- auth.spec.ts --project=auth-emulator'

      # Upload Playwright artefacts on failure so investigating a CI
      # break doesn't require re-running locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
