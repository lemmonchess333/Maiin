name: Verify app

# The verify skill (`.claude/skills/verify/SKILL.md`, `npm run verify:app`)
# run in CI: the emulator rig boots, the seed chain runs, the app is built
# against the emulators, and the feature map's features are driven in
# Chromium. The report, the step trace and a screenshot per step are the
# run's artifact; the report is also the job summary.
#
# Two reasons it runs here as well as in a session:
#
# - Cloud sandboxes cannot always boot the Firestore emulator: its jar
#   downloads from storage.googleapis.com, which a sandbox's egress may
#   block. There the skill runs only the signed-out features and reports
#   the run as incomplete; this job is where the signed-in ones run.
#   `workflow_dispatch` takes the features to drive.
# - The skill is the agents' smoke-test harness, so a change to the skill
#   itself runs the WHOLE map three rounds back to back, and any feature
#   whose verdict moves between rounds fails the job as flaky. A flaky
#   harness teaches retrying instead of fixing.
#
# Not a required check: it runs only when the skill changes or on demand.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/verify/**"
      - ".claude/skills/verify/**"
      - ".github/workflows/verify-app.yml"
  workflow_dispatch:
    inputs:
      features:
        description: "Feature ids, comma-separated (empty: the whole map)"
        required: false
        default: ""
      repeat:
        description: "Rounds (2 or more reports any flaky feature)"
        required: false
        default: "1"

# Supersede, don't stack, as ci.yml does: a newer push to the same branch
# makes an older run's verdict worthless. main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Reads the repository and nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Cold: about 2 minutes to install, 2 to build, 2 to seed; then the
    # map's 35 features take 1 to 3 seconds each per round.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      # firebase-tools errors out hard on JDK < 21.
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          PW_VERSION=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 13
        run: bash scripts/ci/install-playwright-chromium.sh install 200
      - name: Install Chromium deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: bash scripts/ci/install-playwright-chromium.sh install-deps 140

      - run: npm install -g firebase-tools@15.34.0

      - name: Drive the feature map
        env:
          FEATURES: ${{ inputs.features }}
          REPEAT: ${{ inputs.repeat }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            set -- --all --repeat 3
          elif [ -n "$FEATURES" ]; then
            set -- --features "$FEATURES" --repeat "${REPEAT:-1}"
          else
            set -- --all --repeat "${REPEAT:-1}"
          fi
          npm run verify:app -- "$@" --out verify-out

      - name: Report
        if: always()
        run: |
          if [ -f verify-out/report.md ]; then
            cat verify-out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The rig did not start; read the step log above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the rig
        if: always()
        run: npm run verify:app -- --down

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report
          path: |
            verify-out/
            .verify/emulators.log
            .verify/preview.log
          retention-days: 7
          if-no-files-found: ignore
          # The rig's logs live in the git-ignored .verify/.
          include-hidden-files: true
