# Auto-update open PR branches with the latest main, so stale PRs
# don't sit blocked behind a "merge conflict / branch out of date"
# state after a merge wave.
#
# Trigger: every push to main (which is every PR merge).
# For each open PR, calls `gh pr update-branch` — GitHub creates a
# merge commit bringing main INTO the PR branch (not a rebase, so no
# force-push, the PR's commit history is preserved). If there's a
# genuine conflict, the API call fails for that PR and the user gets
# notified via the PR conversation; we log + continue with the others.
#
# Re-triggering the required checks on the new head SHA
# ----------------------------------------------------
# Pushes made by GITHUB_TOKEN do NOT trigger other workflows on the
# same repo (GitHub's anti-loop policy — see
# https://docs.github.com/en/actions/using-workflows/triggering-a-workflow).
# So the merge commit this workflow creates under GITHUB_TOKEN does NOT
# fire `emulator-tests` / `CI` on the PR's new head SHA on its own — the
# PR would sit at `mergeable_state: "blocked"` with ZERO checks until
# someone nudges its branch manually (the empty-commit dance).
#
# We close that ourselves: `workflow_dispatch` and `repository_dispatch`
# are the DOCUMENTED EXCEPTION to the anti-loop policy — they create runs
# even when invoked with GITHUB_TOKEN (the call is explicit, not
# loop-prone; see the 2022-09-08 Actions changelog). So after an update
# that actually moved the head, we explicitly `gh workflow run` the
# required check workflows on the PR branch. They run on the new head
# SHA and report `emulator-tests` / `unit` back onto the PR — no manual
# nudge needed. (Both workflows declare `workflow_dispatch:`.)
#
# PAT vs GITHUB_TOKEN:
#   When the optional `AUTO_UPDATE_PR_BRANCHES_PAT` secret is present we
#   use it for `update-branch` — PAT-attributed pushes trigger the
#   downstream workflows by themselves (and let pull_request workflows
#   run without the automation-approval prompt), so we DON'T also
#   dispatch (that would double-run CI). When the PAT is absent we fall
#   back to GITHUB_TOKEN + the explicit dispatch above. Either way the
#   PR ends up with fresh checks on its new head; the PAT path is just
#   tidier (one run instead of push+dispatch) — it is NOT required to
#   avoid the manual nudge anymore.
#
# This workflow is intentionally tolerant — a single PR that fails to
# update (conflict) doesn't abort the loop.

name: Auto-update PR branches on main push

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # required for `gh workflow run` (dispatch the checks)

# Serialise the job so two main pushes in quick succession don't race.
# We don't need to cancel — each run handles whichever PRs are open at
# that moment, so queuing is correct.
concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR branch with main
        env:
          # Prefer the PAT; fall back to GITHUB_TOKEN. See the workflow
          # header for the trade-off — both paths now leave the PR with
          # fresh checks; the GITHUB_TOKEN path re-dispatches them
          # explicitly (the workflow_dispatch anti-loop exception).
          PAT: ${{ secrets.AUTO_UPDATE_PR_BRANCHES_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Required check workflows to re-dispatch on the new head SHA
          # when running under GITHUB_TOKEN. Keep in sync with the repo's
          # required status checks (branch protection / ruleset for main).
          CHECK_WORKFLOWS: "emulator-tests.yml ci.yml"
        run: |
          if [ -n "$PAT" ]; then
            export GH_TOKEN="$PAT"
            USE_DISPATCH=0
            echo "Using AUTO_UPDATE_PR_BRANCHES_PAT — its push re-runs the checks on each auto-updated PR."
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            USE_DISPATCH=1
            echo "AUTO_UPDATE_PR_BRANCHES_PAT not configured — using GITHUB_TOKEN and re-dispatching"
            echo "the required checks explicitly (workflow_dispatch anti-loop exception)."
          fi

          # List all open PRs targeting main.
          PR_NUMBERS=$(gh pr list --repo "$REPO" --base main --state open --json number --jq '.[].number')
          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs to update."
            exit 0
          fi
          echo "Open PRs to update: $PR_NUMBERS"

          for pr in $PR_NUMBERS; do
            echo ""
            echo "→ Updating PR #$pr"

            # `gh pr update-branch` exits NON-ZERO when there's nothing to do
            # (already up to date) or it can't (conflict); it exits 0 ONLY when
            # it actually created a merge commit (= the head genuinely moved).
            # So exit 0 is itself the "head changed" signal — we DON'T compare
            # headRefOid before/after, because the PR object's cached
            # `headRefOid` lags the ref update and read stale right after the
            # call, making every PR look "unchanged" and suppressing the
            # re-dispatch entirely (the bug this replaces).
            if ! gh pr update-branch "$pr" --repo "$REPO"; then
              echo "  (PR #$pr not updated — conflict or already up-to-date; no re-dispatch)"
              continue
            fi
            echo "  PR #$pr branch updated"

            # The update is a GITHUB_TOKEN push, so the anti-loop policy
            # suppressed emulator-tests / CI on the new head. Re-dispatch them
            # explicitly (workflow_dispatch is the documented exception) on the
            # branch ref, which IS updated by the time update-branch returns.
            if [ "$USE_DISPATCH" = "1" ]; then
              branch=$(gh pr view "$pr" --repo "$REPO" --json headRefName --jq '.headRefName')
              for wf in $CHECK_WORKFLOWS; do
                if gh workflow run "$wf" --repo "$REPO" --ref "$branch"; then
                  echo "    dispatched $wf on $branch"
                else
                  echo "::warning::could not dispatch $wf on $branch for PR #$pr (workflow_dispatch missing? branch gone?)"
                fi
              done
            fi
          done
