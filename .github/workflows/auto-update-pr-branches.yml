# Auto-update open PR branches with the latest main, so stale PRs
# don't sit blocked behind a "merge conflict / branch out of date"
# state after a merge wave.
#
# Trigger: every push to main (which is every PR merge).
# For each open PR, calls `gh pr update-branch` — GitHub creates a
# merge commit bringing main INTO the PR branch (not a rebase, so no
# force-push, the PR's commit history is preserved). If there's a
# genuine conflict, the API call fails for that PR and the user gets
# notified via the PR conversation; we log + continue with the others.
#
# PAT vs GITHUB_TOKEN — known trade-off:
#   Pushes made by GITHUB_TOKEN do NOT trigger other workflows on the
#   same repo (GitHub's anti-loop policy — see
#   https://docs.github.com/en/actions/using-workflows/triggering-a-workflow).
#   That means a merge commit pushed by this workflow under
#   GITHUB_TOKEN does NOT fire `emulator-tests` on the PR's new head
#   SHA, so the PR sits at `mergeable_state: "blocked"` until someone
#   nudges its branch manually (empty commit, push from a clone, etc).
#
#   The cure is a PAT (Personal Access Token) scoped to this repo
#   with `contents: write` + `pull-requests: write`, stored as repo
#   secret `AUTO_UPDATE_PR_BRANCHES_PAT`. PAT-attributed pushes DO
#   trigger downstream workflows, so emulator-tests re-runs on the
#   merge commit automatically.
#
#   When the PAT is present we use it. When it's absent we fall back
#   to GITHUB_TOKEN with a loud warning in the job log: PR branches
#   still get auto-updated (the main goal), but each will need a
#   manual nudge before merge. This avoids red-crossing every main
#   push in the repos that haven't configured the secret yet.
#
# This workflow is intentionally tolerant — `|| true` on each
# update-branch call so one failing PR doesn't abort the loop.

name: Auto-update PR branches on main push

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialise the job so two main pushes in quick succession don't race.
# We don't need to cancel — each run handles whichever PRs are open at
# that moment, so queuing is correct.
concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR branch with main
        env:
          # Prefer the PAT; fall back to GITHUB_TOKEN. See workflow
          # comment for the trade-off: GITHUB_TOKEN doesn't retrigger
          # emulator-tests on the new head SHA (anti-loop policy), so
          # auto-updated PRs will need a manual nudge before merging.
          PAT: ${{ secrets.AUTO_UPDATE_PR_BRANCHES_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$PAT" ]; then
            export GH_TOKEN="$PAT"
            echo "Using AUTO_UPDATE_PR_BRANCHES_PAT — emulator-tests will re-run on each auto-updated PR."
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            echo "::warning::AUTO_UPDATE_PR_BRANCHES_PAT not configured — falling back to GITHUB_TOKEN."
            echo "::warning::PR branches will still be auto-updated, but emulator-tests will NOT re-run"
            echo "::warning::on the merge commits (GitHub's anti-loop policy). Each affected PR needs a"
            echo "::warning::manual nudge (e.g. empty commit) before it can be merged."
            echo "::warning::To restore automatic re-runs, create a fine-grained PAT for this repo with"
            echo "::warning::Contents: Read and write + Pull requests: Read and write, and add it as the"
            echo "::warning::repository secret AUTO_UPDATE_PR_BRANCHES_PAT."
          fi

          # List all open PRs targeting main.
          PR_NUMBERS=$(gh pr list --repo "$REPO" --base main --state open --json number --jq '.[].number')
          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs to update."
            exit 0
          fi
          echo "Open PRs to update: $PR_NUMBERS"
          for pr in $PR_NUMBERS; do
            echo ""
            echo "→ Updating PR #$pr"
            # `|| true` so a single PR with a conflict doesn't abort the
            # whole job. The CLI prints a useful error per-PR; check the
            # job log if a PR stays stale.
            gh pr update-branch "$pr" --repo "$REPO" || echo "  (PR #$pr could not be updated — likely a conflict or already up-to-date)"
          done
