# Auto-update open PR branches with the latest main, so stale PRs
# don't sit blocked behind a "merge conflict / branch out of date"
# state after a merge wave.
#
# Trigger: every push to main (which is every PR merge).
# Scope: only PRs that are trying to merge — auto-merge enabled OR the
# `auto-update` label. Updating EVERY open PR on every merge churned
# in-progress branches needlessly (each update re-runs CI on a new head),
# so the loop is gated to merge-intent PRs. For each of those, calls
# `gh pr update-branch` — GitHub creates a
# merge commit bringing main INTO the PR branch (not a rebase, so no
# force-push, the PR's commit history is preserved). If there's a
# genuine conflict, the API call fails for that PR and the user gets
# notified via the PR conversation; we log + continue with the others.
#
# Re-triggering the required checks on the new head SHA
# ----------------------------------------------------
# Pushes made by GITHUB_TOKEN do NOT trigger other workflows on the
# same repo (GitHub's anti-loop policy — see
# https://docs.github.com/en/actions/using-workflows/triggering-a-workflow).
# So the merge commit this workflow creates under GITHUB_TOKEN does NOT
# fire `emulator-tests` / `CI` on the PR's new head SHA on its own — the
# PR would sit at `mergeable_state: "blocked"` with ZERO checks until
# someone nudges its branch manually (the empty-commit dance).
#
# A `workflow_dispatch` re-run used to stand in for that, on the
# grounds that dispatch is the documented exception to the anti-loop
# policy. It creates the runs, and the runs are useless here: a required
# status check on this repo is bound to the pull_request event, and a
# dispatched run is a different event. The checks go GREEN and the
# ruleset does not count them. The PR sits at `Required status check
# "unit" is expected`, which no re-run can clear, because no re-run
# changes the event. That cost PR #1322, and then cost a whole merge
# queue: eight PRs held there for over an hour, while the only ones that
# merged were the ones whose branches had been updated through the REST
# API under a human token.
#
# So this job now REQUIRES `AUTO_UPDATE_PR_BRANCHES_PAT` and does
# nothing without it. Only a non-GITHUB_TOKEN push produces
# ruleset-satisfying CI; everything else is a way of making a PR
# unmergeable. Nothing is lost by standing down, because the ruleset
# does not require a branch to be up to date — staleness alone never
# blocked a merge here.
#
# This workflow is intentionally tolerant — a single PR that fails to
# update (conflict) doesn't abort the loop.

name: Auto-update PR branches on main push

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialise the job so two main pushes in quick succession don't race.
# We don't need to cancel — each run handles whichever PRs are open at
# that moment, so queuing is correct.
concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR branch with main
        env:
          # Prefer the PAT; fall back to GITHUB_TOKEN. See the workflow
          # header for the trade-off — both paths now leave the PR with
          # fresh checks; the GITHUB_TOKEN path re-dispatches them
          # explicitly (the workflow_dispatch anti-loop exception).
          PAT: ${{ secrets.AUTO_UPDATE_PR_BRANCHES_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Without the PAT this job does nothing, and that is the whole
          # of the no-PAT path. The `workflow_dispatch` fallback that
          # used to live here is gone: it put GREEN checks on the new
          # head that the ruleset does not count, because a required
          # status check is bound to the pull_request event and a
          # dispatched run is not that event. The PR then sits at
          # `Required status check "unit" is expected` with no way out —
          # no re-run helps, because no re-run changes the event, and
          # every later push to main updates the branch again.
          #
          # Doing nothing is strictly better than updating, because the
          # ruleset does NOT require a branch to be up to date. Measured
          # on two PRs merged with bases several commits behind main. So
          # the update was buying nothing and costing the PR its
          # mergeability.
          if [ -z "$PAT" ]; then
            echo "::warning::AUTO_UPDATE_PR_BRANCHES_PAT is not configured, so this job is a no-op. A GITHUB_TOKEN push cannot produce ruleset-satisfying CI, and updating a branch whose checks then cannot be re-earned leaves the PR permanently unmergeable. Set AUTO_UPDATE_PR_BRANCHES_PAT (a fine-grained PAT or GitHub App token with contents + pull-requests write) to turn this job back on. Until then, branches only go stale, which nothing here requires them not to be."
            exit 0
          fi
          export GH_TOKEN="$PAT"
          echo "Using AUTO_UPDATE_PR_BRANCHES_PAT — its push re-runs the checks on each auto-updated PR."

          # Only auto-update PRs that are actually trying to merge: auto-merge
          # enabled, OR carrying the `auto-update` label (an escape hatch for
          # PRs that want to stay current without auto-merge). Updating EVERY
          # open PR on every main push churned in-progress PRs needlessly —
          # each update re-runs CI on a new head, and on ruleset-gated repos
          # the GITHUB_TOKEN-dispatched checks (below) don't satisfy the gate,
          # so a constantly-churned PR can sit green-but-unmergeable. Gating to
          # merge-intent PRs keeps the branches that need to be current current,
          # and leaves everything else alone until its author opts in.
          PR_NUMBERS=$(gh pr list --repo "$REPO" --base main --state open \
            --json number,autoMergeRequest,labels \
            --jq '.[] | select(.autoMergeRequest != null or any(.labels[]?; .name == "auto-update")) | .number')
          if [ -z "$PR_NUMBERS" ]; then
            echo "No PRs eligible for auto-update (none have auto-merge enabled or the 'auto-update' label)."
            exit 0
          fi
          echo "PRs eligible for auto-update (auto-merge on or 'auto-update' label): $PR_NUMBERS"

          for pr in $PR_NUMBERS; do
            echo ""
            echo "→ Updating PR #$pr"

            # `gh pr update-branch` exits NON-ZERO when there's nothing to do
            # (already up to date) or it can't (conflict); it exits 0 ONLY when
            # it actually created a merge commit (= the head genuinely moved).
            # So exit 0 is itself the "head changed" signal — we DON'T compare
            # headRefOid before/after, because the PR object's cached
            # `headRefOid` lags the ref update and read stale right after the
            # call, making every PR look "unchanged" and suppressing the
            # re-dispatch entirely (the bug this replaces).
            if ! gh pr update-branch "$pr" --repo "$REPO"; then
              echo "  (PR #$pr not updated — conflict or already up-to-date; no re-dispatch)"
              continue
            fi
            echo "  PR #$pr branch updated"
          done
