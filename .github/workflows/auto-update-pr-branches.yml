# Auto-update open PR branches with the latest main, so stale PRs
# don't sit blocked behind a "merge conflict / branch out of date"
# state after a merge wave.
#
# Trigger: every push to main (which is every PR merge).
# For each open PR, calls `gh pr update-branch` — GitHub creates a
# merge commit bringing main INTO the PR branch (not a rebase, so no
# force-push, the PR's commit history is preserved). If there's a
# genuine conflict, the API call fails for that PR and the user gets
# notified via the PR conversation; we log + continue with the others.
#
# Why we use a PAT, not GITHUB_TOKEN:
#   Pushes made by GITHUB_TOKEN do NOT trigger other workflows on the
#   same repo (GitHub's anti-loop policy — see
#   https://docs.github.com/en/actions/using-workflows/triggering-a-workflow).
#   That means the merge commit this workflow creates does NOT fire
#   `emulator-tests` on the PR's new head SHA. The PR then sits
#   forever with `mergeable_state: "blocked"`, waiting for required
#   checks that will never run.
#
#   The empirical evidence: 2026-05-25 main-merge wave left four PRs
#   (#735 #737 #739 #740) with `total_count: 0` for check_runs on
#   the post-auto-merge head — all needed a manual empty-commit nudge
#   to unstick. The earlier comment here ("check status carries over")
#   turned out to be optimistic; branch protection treats each head SHA
#   as a distinct check target.
#
#   Fix: push via a PAT (Personal Access Token) scoped to this repo
#   with `contents: write` + `pull-requests: write`. PAT-attributed
#   pushes DO trigger downstream workflows. Store the token as the
#   repo secret `AUTO_UPDATE_PR_BRANCHES_PAT`. If the secret is
#   absent, the workflow fails loudly (don't silently fall back to
#   GITHUB_TOKEN — that just reintroduces the stalled-CI bug).
#
# This workflow is intentionally tolerant — `|| true` on each
# update-branch call so one failing PR doesn't abort the loop.

name: Auto-update PR branches on main push

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialise the job so two main pushes in quick succession don't race.
# We don't need to cancel — each run handles whichever PRs are open at
# that moment, so queuing is correct.
concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Fail loud if PAT secret missing
        # Better to fail at workflow-start than silently fall back to
        # GITHUB_TOKEN and have CI stall on every PR. The error
        # message tells the operator exactly what to do.
        env:
          PAT: ${{ secrets.AUTO_UPDATE_PR_BRANCHES_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Secret AUTO_UPDATE_PR_BRANCHES_PAT not configured."
            echo "::error::This workflow needs a PAT (not GITHUB_TOKEN) so the merge"
            echo "::error::commits it pushes will trigger emulator-tests on each PR."
            echo "::error::Create a fine-grained PAT for this repo with permissions:"
            echo "::error::  - Contents: Read and write"
            echo "::error::  - Pull requests: Read and write"
            echo "::error::Then add it as repository secret AUTO_UPDATE_PR_BRANCHES_PAT."
            exit 1
          fi

      - name: Update every open PR branch with main
        env:
          # PAT, not GITHUB_TOKEN — see workflow-level comment for why.
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_PR_BRANCHES_PAT }}
          REPO: ${{ github.repository }}
        run: |
          # List all open PRs targeting main.
          PR_NUMBERS=$(gh pr list --repo "$REPO" --base main --state open --json number --jq '.[].number')
          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs to update."
            exit 0
          fi
          echo "Open PRs to update: $PR_NUMBERS"
          for pr in $PR_NUMBERS; do
            echo ""
            echo "→ Updating PR #$pr"
            # `|| true` so a single PR with a conflict doesn't abort the
            # whole job. The CLI prints a useful error per-PR; check the
            # job log if a PR stays stale.
            gh pr update-branch "$pr" --repo "$REPO" || echo "  (PR #$pr could not be updated — likely a conflict or already up-to-date)"
          done
