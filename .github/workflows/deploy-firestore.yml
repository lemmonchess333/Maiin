name: Deploy Firestore Rules & Indexes

on:
  # Production entry point (including manual redeploys): deploy-production.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production environment holds the release credentials: only a
    # job that names it can read its secrets, and its branch rule decides
    # where such a job may run. Repository secrets still reach this job.
    environment: production
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Test deployment verification
        run: python3 -m unittest discover -s scripts -p 'test_verify*py'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.34.0

      # Every install comes before this step: a package's install scripts
      # must never run while the service account key is on disk.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project adaptive-fitness-af8bb --force

      - name: Verify active Firestore Rules source
        run: python3 scripts/verify_deployed_rules.py --service firestore

      # Indexes were previously never deployed by CI — a composite index the app
      # needed (activities visibility+createdAt, for the Explore/Discover feed)
      # was missing in prod, so getDiscoverFeed threw failed-precondition and the
      # Explore tab showed "Couldn't load the community feed". Deploy indexes too.
      #
      # Intentionally NO --force here: a forced index deploy DELETES any prod
      # index not present in firestore.indexes.json (which may be incomplete, if
      # an index was ever created from a console "create index" link). Without
      # --force the deploy is additive — it creates missing indexes and leaves
      # untracked ones alone (deletions are skipped in non-interactive CI).
      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes --project adaptive-fitness-af8bb

      - name: Wait for indexes and retention policies to be ready
        run: python3 scripts/verify-firestore-readiness.py
