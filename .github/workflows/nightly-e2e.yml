name: Nightly signed-out E2E

# owner-answers A11. The six signed-out specs that gate nothing and ran in
# no CI job: accessibility, performance, pwa, security, responsive and
# responsive-safari-standalone. Slower than the three the emulator workflow
# runs on every push (smoke, navigation, legal pages), so they run once a
# night instead of taxing every PR; a red run here is a signal to look, not
# a block on anything.
#
# On chromium, as the emulator workflow runs its signed-out specs.
# responsive-safari-standalone sets an iPhone at its top, which is WebKit,
# so WebKit is installed too.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  signed-out-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"

      # The app's build talks to the emulators, so they run under it.
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # Through the shared script, as every workflow installs Playwright:
      # bounded attempts, with dpkg's lock cleared between them.
      - name: Install Chromium and WebKit for Playwright
        timeout-minutes: 20
        run: bash scripts/ci/install-playwright-chromium.sh install 300 chromium webkit

      - run: npm install -g firebase-tools@15.34.0

      - name: Build app with emulator wiring
        run: npm run build:e2e
        env:
          VITE_USE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-dummy-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-tropos.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-tropos
          VITE_FIREBASE_STORAGE_BUCKET: demo-tropos.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

      - name: Run the nightly signed-out specs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: nightly-report
        run: |
          firebase emulators:exec --only auth,firestore --project demo-tropos \
            'npm run test:e2e -- accessibility.spec.ts performance.spec.ts pwa.spec.ts security.spec.ts responsive.spec.ts responsive-safari-standalone.spec.ts --project=chromium --reporter=line,html'

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          path: nightly-report/
          retention-days: 14
