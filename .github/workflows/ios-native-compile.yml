name: iOS native compile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-native-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-build:
    # The image with Xcode 27.1, the one the release builds with
    # (deploy-ios.yml), so a pull request compiles what ships.
    runs-on: xcode-27
    # Two builds and a simulator launch took most of 60 minutes; the first
    # run on a fresh image may also fetch the iOS and watchOS platforms.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The iOS SDK the app links decides what an iPhone Duo shows it: only
      # a build with the iOS 27.1 SDK uses the whole display; anything older
      # runs there in compatibility mode (docs/ios/iphone-duo.md, owner
      # decision A, 18 November 2026). The xcode-27 image carries several
      # Xcodes and its default is not 27.1, so this selects 27.1 by name
      # (the final release, a point release, or its release candidate) and
      # fails rather than build with another.
      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          XCODE=$(python3 scripts/verify_ios_xcode.py --want 27.1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          python3 scripts/verify_ios_xcode.py --want 27.1 --sdk "$SDK"
          # Building for iOS (asset catalogs, storyboards) and for the
          # embedded Watch app needs the selected Xcode's own platforms,
          # which an image may carry only for its default Xcode. Fetched
          # here when missing, not 40 minutes into the archive.
          for PLATFORM in iOS watchOS; do
            if xcrun simctl list runtimes | grep -q "^$PLATFORM 27\.1"; then
              echo "$PLATFORM 27.1 platform present"
            else
              echo "Downloading the $PLATFORM platform for $(basename "$XCODE")"
              xcodebuild -downloadPlatform "$PLATFORM"
            fi
          done
          xcrun simctl list runtimes
          {
            echo "Xcode: $(basename "$XCODE") ($(xcodebuild -version | tr '\n' ' '))"
            echo "iOS SDK: $SDK; macOS $(sw_vers -productVersion)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The project copies this file into the app bundle. A synthetic plist
      # lets PRs compile the native targets without exposing Firebase secrets
      # or implying the resulting simulator app is suitable for release.
      - name: Place compile-only Firebase plist
        run: |
          cat > ios/App/App/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>compile-only</string>
            <key>GCM_SENDER_ID</key><string>123456789</string>
            <key>GOOGLE_APP_ID</key><string>1:123456789:ios:compileonly</string>
            <key>PROJECT_ID</key><string>compile-only</string>
            <key>BUNDLE_ID</key><string>com.tropos.app</string>
          </dict></plist>
          PLIST
          plutil -lint ios/App/App/GoogleService-Info.plist
      # What the TestFlight upload needs from this image, said here so a
      # pull request finds a missing tool rather than a release run. A
      # warning, not a failure: nothing in this job uses them.
      - name: Check the release's tools on this image
        run: |
          sw_vers
          python3 --version
          if xcrun --find altool > /dev/null 2>&1; then
            echo "altool: $(xcrun --find altool)"
          else
            echo "::warning::xcrun altool is not in Xcode 27.1; deploy-ios.yml's Upload to TestFlight step uses it."
          fi
          if ! security help > /dev/null 2>&1; then
            echo "::warning::the security tool did not answer; deploy-ios.yml's keychain steps use it."
          fi
      - name: Build Capacitor bundle and sync native project
        run: npm run build:ios
        # Placeholders, as the plist above: the web app sets up Firebase
        # Auth as it loads, and Auth refuses an empty API key, so a bundle
        # built without one never mounts and the launch check below sees
        # only the page's background. Nothing calls Firebase before sign-in.
        env:
          VITE_FIREBASE_API_KEY: compile-only-key
          VITE_FIREBASE_AUTH_DOMAIN: compile-only.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: compile-only
          VITE_FIREBASE_STORAGE_BUCKET: compile-only.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: "1:123456789:web:compileonly"
      # The same project builds both kinds of TestFlight build: a standard
      # one, which embeds no Watch app and carries the short Health text, and
      # the pilot, which overrides the release gate exactly as deploy-ios.yml
      # does. Standard first: the pilot's embedded Watch app would otherwise
      # be left behind in the shared products folder and read as the standard
      # build's. Sharing the derived data lets the pilot reuse what it can.
      - name: Compile a standard build for simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/tropos-ios-build" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Check the standard build carries no Watch app
        run: |
          python3 scripts/verify_ios_watch.py --unsigned \
            --app "$RUNNER_TEMP/tropos-ios-build/Build/Products/Release-iphonesimulator/App.app" \
            --expected-connected-training NO
      # The scene life cycle (ios/App/App/SceneDelegate.swift, required of
      # iOS 27 SDK builds) is wiring a compile cannot check: a scene
      # delegate the manifest names wrongly, or a scene with no window,
      # launches to a black screen while the process stays up. So the
      # standard build is launched on a simulator, before the pilot build
      # replaces it, and must still be running and drawing after 25 s.
      # The compile-only Firebase plist is given IDs in Firebase's own
      # formats inside the built app, so its checks at launch pass; nothing
      # it sends can reach a project.
      - name: Launch the standard build on a simulator
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/tropos-ios-build/Build/Products/Release-iphonesimulator/App.app"
          PLIST="$APP/GoogleService-Info.plist"
          plutil -replace GOOGLE_APP_ID -string "1:123456789012:ios:0123456789abcdef012345" "$PLIST"
          plutil -replace GCM_SENDER_ID -string "123456789012" "$PLIST"
          plutil -replace API_KEY -string "AIzaSyA00000000000000000000000000000000" "$PLIST"
          # An iPhone on the newest iOS runtime the selected Xcode's SDK
          # covers (a beta runtime newer than the SDK is passed over), by
          # version number, then the first by name, so the same image picks
          # the same phone. Not the iPhone Duo: it has two displays, so a
          # screenshot has to name one, and it is launched on its own where
          # the image has it.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available --json | SDK="$SDK" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          sdk = tuple(int(p) for p in os.environ["SDK"].split(".")[:2])
          def version(runtime):
              m = re.search(r"\.iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else None
          phones = sorted(
              (version(runtime), d["name"], d["udid"])
              for runtime, ds in devices.items() if version(runtime)
              for d in ds if d["name"].startswith("iPhone")
              and not d["name"].startswith("iPhone Duo")
          )
          if not phones:
              sys.exit("no iPhone simulator is available on this runner")
          covered = [p for p in phones if p[0] <= sdk] or phones
          newest = covered[-1][0]
          print(next(p for p in covered if p[0] == newest)[2])
          ')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          LAUNCHED=$(xcrun simctl launch "$UDID" com.tropos.app)
          echo "$LAUNCHED"
          PID="${LAUNCHED##* }"
          sleep 25
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/launch.png"
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The app was no longer running 25 s after launch"
            exit 1
          fi
          if ! python3 scripts/verify_ios_launch.py --screenshot "$RUNNER_TEMP/launch.png"; then
            echo "The app's log since it was installed:"
            xcrun simctl spawn "$UDID" log show --last 5m --style compact \
              --predicate 'process == "App"' | tail -n 120 || true
            exit 1
          fi
          xcrun simctl shutdown "$UDID"
      - name: Keep the launch screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-launch
          path: ${{ runner.temp }}/launch.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Launch the standard build on the iPhone Duo simulator
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/tropos-ios-build/Build/Products/Release-iphonesimulator/App.app"
          # Xcode 27.1 brings the iPhone Duo's simulator, both displays in
          # one device. The Duo on the newest runtime the SDK covers (as the
          # phone above, a newer one only when none is covered), made there
          # when the image has none; a named failure when this Xcode has no
          # Duo at all, so a step back to an older Xcode says so.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(SDK="$SDK" python3 -c '
          import json, os, re, subprocess, sys
          def listed(kind, *only):
              out = subprocess.check_output(["xcrun", "simctl", "list", kind, *only, "--json"])
              return json.loads(out)[kind]
          def version(identifier):
              m = re.search(r"\.iOS-(\d+)-(\d+)", identifier)
              return (int(m.group(1)), int(m.group(2))) if m else None
          def covered(found):
              return [f for f in found if f[0] <= sdk] or found
          duo = next((t["identifier"] for t in listed("devicetypes") if t["name"] == "iPhone Duo"), None)
          if duo is None:
              sys.exit("::error::This Xcode has no iPhone Duo simulator")
          sdk = tuple(int(p) for p in os.environ["SDK"].split(".")[:2])
          made = covered(sorted(
              (version(runtime), d["udid"])
              for runtime, ds in listed("devices", "available").items() if version(runtime)
              for d in ds if d.get("deviceTypeIdentifier", duo) == duo and d["name"].startswith("iPhone Duo")
          ))
          if made:
              print(made[-1][1])
              sys.exit(0)
          runtimes = covered(sorted(
              (version(r["identifier"]), r["identifier"])
              for r in listed("runtimes") if r.get("isAvailable", True) and version(r["identifier"])
              and duo in [t["identifier"] for t in r.get("supportedDeviceTypes", [])]
          ))
          if not runtimes:
              sys.exit("::error::No iOS runtime on this runner runs the iPhone Duo simulator")
          print(subprocess.check_output(
              ["xcrun", "simctl", "create", "iPhone Duo", duo, runtimes[-1][1]], text=True
          ).strip())
          ')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          trap 'xcrun simctl shutdown "$UDID" || true' EXIT
          xcrun simctl bootstatus "$UDID" -b
          sleep 10
          # A screenshot of a device with two displays has to name one, and
          # simctl lists them when it is not told ("--display=1 LCD
          # (primary) 1398x2034"). Should it ever pick one itself, that one
          # is the only display shot.
          PROBE=0
          LISTED=$(xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/duo-probe.png" 2>&1) || PROBE=$?
          DISPLAYS=""
          if [ "$PROBE" -eq 0 ]; then
            DISPLAYS="default only ?"
          else
            while read -r LINE; do
              [ -n "$LINE" ] || continue
              NUMBER=$(printf '%s' "$LINE" | sed -E 's/^--display=([0-9]+).*/\1/')
              SIZE=$(printf '%s' "$LINE" | grep -oE '[0-9]+x[0-9]+$')
              case "$SIZE" in
                1398x2034 | 2034x1398) NAME=outer ;;
                2007x2853 | 2853x2007) NAME=inner ;;
                *) NAME="display-$NUMBER" ;;
              esac
              DISPLAYS="$DISPLAYS$NUMBER $NAME $SIZE"$'\n'
            done <<< "$(printf '%s\n' "$LISTED" | grep -oE -- '--display=[0-9]+[[:space:]].*[0-9]+x[0-9]+' || true)"
          fi
          if [ -z "$DISPLAYS" ]; then
            echo "$LISTED"
            echo "::error::simctl listed no displays for the iPhone Duo"
            exit 1
          fi
          shoot() { # shoot NUMBER FILE
            if [ "$1" = default ]; then
              xcrun simctl io "$UDID" screenshot "$2" < /dev/null
            else
              xcrun simctl io "$UDID" screenshot --display="$1" "$2" < /dev/null
            fi
          }
          lit() { # lit FILE: true when the middle of it is lit; stops the step on a file it cannot read
            local code=0
            python3 scripts/verify_ios_launch.py --screenshot "$1" 2> "$1.err" || code=$?
            if [ "$code" -gt 1 ]; then
              cat "$1.err"
              echo "::error::The launch check could not read $1"
              exit 1
            fi
            return "$code"
          }
          # Before the launch: the display the simulator is showing has the
          # home screen on it, and a folded-away one is dark. The app has to
          # be drawing on every display that was showing.
          SHOWING=""
          while read -r NUMBER NAME SIZE; do
            [ -n "$NUMBER" ] || continue
            echo "The $NAME display ($SIZE), before the launch:"
            shoot "$NUMBER" "$RUNNER_TEMP/duo-$NAME-home.png"
            if lit "$RUNNER_TEMP/duo-$NAME-home.png"; then SHOWING="$SHOWING $NAME "; fi
          done <<< "$DISPLAYS"
          xcrun simctl install "$UDID" "$APP"
          LAUNCHED=$(xcrun simctl launch "$UDID" com.tropos.app)
          echo "$LAUNCHED"
          PID="${LAUNCHED##* }"
          sleep 25
          {
            echo "### The iPhone Duo simulator"
            echo
            echo "| Display | Size (px) | Before the launch | 25 s after it |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          DRAWING=""
          MISSING=""
          while read -r NUMBER NAME SIZE; do
            [ -n "$NUMBER" ] || continue
            echo "The $NAME display ($SIZE), 25 s after the launch:"
            shoot "$NUMBER" "$RUNNER_TEMP/duo-$NAME.png"
            BEFORE=dark
            case "$SHOWING" in *" $NAME "*) BEFORE="home screen" ;; esac
            if lit "$RUNNER_TEMP/duo-$NAME.png"; then
              DRAWING="$DRAWING $NAME"
              AFTER="the app drawing"
            else
              AFTER=dark
              if [ "$BEFORE" != dark ]; then MISSING="$MISSING $NAME"; fi
            fi
            echo "| $NAME ($NUMBER) | $SIZE | $BEFORE | $AFTER |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$DISPLAYS"
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The app was no longer running on the iPhone Duo 25 s after launch"
            exit 1
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::The app is not drawing on the iPhone Duo's$MISSING display, which was showing before the launch"
            exit 1
          fi
          if [ -z "$DRAWING" ]; then
            echo "::error::Neither of the iPhone Duo's displays shows the app 25 s after launch"
            exit 1
          fi
          if [ -z "$SHOWING" ]; then
            echo "::warning::No display was lit before the launch, so which one the app should be on is unknown"
          fi
      - name: Keep the iPhone Duo screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-duo
          path: ${{ runner.temp }}/duo-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Compile the connected training pilot for simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/tropos-ios-build" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            WATCH_RUN_RELEASE_ENABLED=YES \
            build
      - name: Check the pilot build embeds the Watch app
        run: |
          python3 scripts/verify_ios_watch.py --unsigned \
            --app "$RUNNER_TEMP/tropos-ios-build/Build/Products/Release-iphonesimulator/App.app" \
            --expected-connected-training YES
