name: Verify Active Production Rules

# Read-only audit, independent of the Storage deployment/approval gate.
# No credentials or production access on pull requests.
on:
  push:
    branches: [main]
    paths:
      - scripts/verify_deployed_rules.py
      - scripts/test_verify_deployed_rules.py
      - scripts/verify_storage_rules_iam.py
      - scripts/test_verify_storage_rules_iam.py
      - .github/workflows/verify-production-rules.yml
  # Also the quick way to confirm a Storage permission grant took effect,
  # without waiting for a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The production environment holds the release credentials: only a
    # job that names it can read its secrets, and its branch rule decides
    # where such a job may run. Repository secrets still reach this job.
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the verifiers without credentials
        run: python3 -m unittest discover -s scripts -p 'test_verify*.py' -v
      - name: Authenticate with the existing deploy identity
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Compare active Firestore and Storage source
        env:
          TROPOS_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: python3 scripts/verify_deployed_rules.py
      - name: Confirm Storage rules can read Firestore
        # Runs even when the source comparison fails: the two answer
        # different questions, and a missing grant is worth knowing either way.
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: python3 scripts/verify_storage_rules_iam.py
