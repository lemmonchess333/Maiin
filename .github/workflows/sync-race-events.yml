name: Sync race events to Firestore

# RACE-EVENTS-REMOTE (locked 2026-07-20): on merge to main, mirror the
# race event blocks from spaceDefs.ts into `config/raceEvents` so date
# updates reach every platform — including native binaries that
# haven't updated — without an app release. Git stays the source of
# truth; this workflow is the ONLY writer of the doc (rules deny all
# client writes), so drift is structurally impossible.

on:
  push:
    branches:
      - main
    paths:
      - "src/features/spaces/spaceDefs.ts"
  # Manual trigger for the first backfill run / re-sync on demand.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Write config/raceEvents from spaceDefs
        run: npx tsx scripts/sync-race-events.ts
