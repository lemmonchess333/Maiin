name: Sync race events to Firestore

# RACE-EVENTS-REMOTE (locked 2026-07-20): on merge to main, mirror the
# race event blocks from spaceDefs.ts into `config/raceEvents` so date
# updates reach every platform — including native binaries that
# haven't updated — without an app release. Retain dates verified by the
# daily refresher unless a reviewed bundled-date change supersedes them.
# Both Admin writers share a concurrency group; client writes are denied.

on:
  push:
    branches:
      - main
    paths:
      - "src/features/spaces/spaceDefs.ts"
      - "scripts/sync-race-events.ts"
      - "scripts/races/remote-events.ts"
  # Manual trigger for the first backfill run / re-sync on demand.
  workflow_dispatch:

concurrency:
  group: race-events-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Install and one Firestore write script: 1 to 6 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Write config/raceEvents from spaceDefs
        run: npx tsx scripts/sync-race-events.ts
