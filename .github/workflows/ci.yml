name: CI

# Runs lint + the unit Vitest suite + the production build on every PR
# into main and Codex release branches, so a failing check BLOCKS the merge.
#
# Why this exists (the gap it closes): deploy.yml runs these exact steps
# but only on `push: main` — i.e. AFTER a PR merges. emulator-tests.yml
# runs on PRs but only the emulator / rules / e2e suites, NOT the plain
# `npm run test` unit suite. So nothing ran the unit suite as a PR gate:
# a PR with a failing unit test could auto-merge and only surface red
# post-merge on main (exactly what happened with the devices-rule PR
# #1010 — its account-deletion drift snapshot test failed only after the
# merge). This workflow makes the unit suite a PR-time check.
#
# To actually GATE merges, the `unit` job must be marked a required
# status check in the repo's branch-protection / ruleset for main —
# that's a one-time GitHub Settings action (Settings → Rules/Branches →
# require status checks → add "CI / unit"). Until then this runs and
# reports red but does not block auto-merge.

on:
  push:
    branches: ["codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Supersede, don't stack. Measured 2026-09-18 on one commit
# (`cfabe9d8`): `auto-update-pr-branches` rewrites every open PR's head
# whenever main moves, which restarts all of this repo's checks on all of
# them at once — and nothing cancelled the runs for the heads those
# rewrites had just obsoleted. Thirteen PRs' worth of runs for commits
# that would never merge sat in the queue ahead of the ones that would,
# and a `CI` run created at 08:37 had still not STARTED by 09:08.
#
# `github.ref` keeps push and pull_request in SEPARATE groups on purpose.
# Collapsing them would also cancel the duplicate the two triggers
# produce for one commit, which is real waste — but a cancelled run
# posts a cancelled check under the same workflow name on the same sha
# as the live one, and that is the PR's own gate. Superseding within one
# event only ever cancels a run for an OLDER commit, whose checks gate
# nothing. The wider change is a deliberate call, not a tidy-up.
#
# main is excluded: every commit that lands there gets verified, even
# when two land close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Test production Rules verifier (offline)
        run: python3 -m unittest discover -s scripts -p 'test_verify_deployed_rules.py' -v
      - run: npm run check:form-art
      # Zero-cycle gate (2026-07-11 repo audit batch 3): six circular
      # import chains were removed by relocating shared types to neutral
      # modules; this keeps the dependency graph acyclic.
      - run: npm run check:cycles
      - run: npm run test -- --run
      # Build (tsc -b + vite) so type / bundling errors are caught at PR
      # time too, matching deploy.yml. Same-repo PRs have access to the
      # VITE_ secrets; the app reads them at runtime, so the bundle is
      # well-formed even if a value is absent.
      # Timed with a soft budget (2026-07-11 repo audit): Tailwind v4
      # source scanning is scoped to src/ in index.css — if a change
      # reintroduces repo-root scanning (or anything else balloons the
      # build), the duration log + warning annotation surfaces it at PR
      # time instead of silently degrading every CI run.
      - name: Build (timed, 300s soft budget)
        run: |
          start=$(date +%s)
          npm run build
          elapsed=$(( $(date +%s) - start ))
          echo "build took ${elapsed}s"
          if [ "$elapsed" -gt 300 ]; then
            echo "::warning::npm run build took ${elapsed}s (>300s soft budget) — check Tailwind source scoping / bundle inputs"
          fi
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      # Dist-size ratchet: per-chunk + total budget against
      # scripts/dist-size.baseline.json (5% growth tolerance; new large
      # chunks must be added deliberately). chunkSizeWarningLimit in
      # vite.config.ts is a raised warning, not a budget — this is the budget.
      - run: npm run check:dist-size

  # Timezone gate (2026-09-17). The unit suite used to run only in the
  # runner's UTC, which makes it blind to the exact class CLAUDE.md names
  # as recurring: "never mix local-date and UTC operations in one
  # calculation". Measured on unmodified main before this job existed —
  # 8 tests failed at Pacific/Kiritimati (UTC+14) and 3 at Pacific/Midway
  # (UTC-11), all of them date FIXTURES pinned to a `Z` instant while the
  # code under test answers in the local day. Every one was green in UTC.
  #
  # Both signs are run because their failures were not the same set: an
  # eastern offset moves a fixture forward across local midnight, a
  # western one moves it back, and a test can be wrong in one direction
  # only. The suite is ~2 minutes, so this costs two parallel runs.
  unit-timezone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The two extremes of the inhabited range (UTC-12..UTC+14), plus
        # one zone that observes DST.
        #
        # Auckland is not here for its offset — Kiritimati already covers
        # the east. It is here because NEITHER extreme observes DST, and
        # neither does UTC, so without it the whole daylight-saving class
        # is invisible to this gate. That is not hypothetical: on
        # 2026-09-17, `TrainingForChip.test.tsx` was ALREADY failing in
        # Auckland on main and green everywhere else. It asks for a race
        # 21 days out and expects "3 wks"; Auckland's spring-forward falls
        # inside that span, so the 21 days measured 20.958 and the chip
        # said 2. A pre-existing test, written by someone else, caught a
        # real bug by living through the transition — and the two extreme
        # offsets would have reported green.
        #
        # Detection here is necessarily intermittent: a relative-date test
        # only exercises a transition during the weeks its span straddles
        # one. `wholeWeeksBetween.test.ts` pins absolute dates either side
        # of known transitions and so covers the class deterministically
        # in every zone; this entry is the backstop for the tests that
        # compute their dates from today.
        tz: ["Pacific/Kiritimati", "Pacific/Midway", "Pacific/Auckland"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Unit suite in ${{ matrix.tz }}
        run: npm run test -- --run
        env:
          TZ: ${{ matrix.tz }}

  # The suite had only ever run in one LOCALE, the same blind spot the
  # unit-timezone job above exists for. Measured 2026-09-17: 26
  # assertions across 14 files failed under de-DE and 18 under fr-FR,
  # and one was a production defect rather than a fixture — a wrapped
  # `toLocaleDateString(undefined, …)` rendering every saved workout's
  # date in the DEVICE's order, which the line-by-line date guard could
  # not see.
  #
  # Two locales because they exercise two DIFFERENT mechanisms, and
  # neither substitutes for the other:
  #
  #   de-DE  the separator is a different CHARACTER (".") — and one that
  #          is a regex metacharacter, so an unescaped interpolation
  #          silently widens a pattern instead of failing it.
  #   fr-FR  the separator is U+202F, which Testing Library's matchers
  #          normalise to a plain space. A raw needle never meets the
  #          normalised haystack, and the two strings look identical in
  #          the failure output.
  #
  # Grouping deliberately follows the viewer (see dateTreatment.test.ts),
  # so this gate is not about forcing one rendering — it is about
  # assertions not quietly pinning whichever locale CI resolves.
  unit-locale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        locale: ["de_DE.UTF-8", "fr_FR.UTF-8"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # Prove the locale actually took, before trusting a green suite.
      # Node resolves its default locale through ICU from LANG/LC_ALL; if
      # a runner ever fails to pick it up, the suite would run in en-US
      # and pass vacuously — a gate reporting success while testing
      # nothing, which is worse than no gate.
      - name: Confirm the runtime resolved ${{ matrix.locale }}
        run: |
          node -e '
            const want = process.env.LC_ALL.split(".")[0].replace("_", "-");
            const got = Intl.NumberFormat().resolvedOptions().locale;
            const sep = (1000).toLocaleString().replace(/[0-9]/g, "");
            if (!got.startsWith(want)) {
              console.error(`locale did not take: wanted ${want}, resolved ${got}`);
              process.exit(1);
            }
            if (sep === ",") {
              console.error(`${got} grouped with a comma — this job would not exercise the class it exists for`);
              process.exit(1);
            }
            console.log(`${got} groups 1000 as ${(1000).toLocaleString()}`);
          '
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}
      - name: Unit suite in ${{ matrix.locale }}
        run: npm run test -- --run
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}

  # The suite had only ever run at ONE moment — whenever CI happened to
  # start — and a test fixture carrying a date literal is inside whatever
  # window the code applies only until the clock walks past it. Then it
  # fails on a calendar morning, with no commit, and the failure names
  # the assertion rather than the cause.
  #
  # Not hypothetical. Measured on 2026-09-17 by shifting the process
  # clock: `ExerciseHistory.test.tsx` opens the page on its 3-month range
  # pill against sessions dated "2026-07-20", so both tests pass on
  # 2026-10-17 and fail on 2026-10-18 — exactly 90 days later, 31 days
  # after the measurement — with "expected length 2, got 1" and "unable
  # to find BW × 10".
  #
  # 90 days, chosen against two edges rather than picked round:
  #
  #   LOW   a shorter horizon finds a bomb with less notice than it takes
  #         to notice and fix one. A quarter is the smallest warning that
  #         is comfortably more than the problem.
  #   HIGH  the race catalogue's last event is 2027-06-13, and a lapsed
  #         catalogue is DELIBERATELY not a build failure — see
  #         `scripts/check-race-dates.ts`, which files a monthly issue
  #         precisely so that a calendar date cannot redden unrelated
  #         PRs. A horizon past that would contradict it.
  #
  # So this gate goes red a quarter BEFORE a fixture expires, which is a
  # warning with slack rather than a morning surprise.
  unit-future:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # Prove the clock actually moved, before trusting a green suite —
      # the `unit-locale` job's lesson. A mis-set variable or a require
      # that never reached the workers would leave this running at the
      # ordinary date and reporting that the fixtures are safe for
      # another quarter, having checked nothing. `date` is the shell's,
      # outside any Node process this could have patched.
      - name: Confirm the clock shifted
        run: |
          real=$(date -u +%s)
          shifted=$(TROPOS_CLOCK_OFFSET_DAYS=90 node --require ./scripts/fake-clock.cjs \
            -e 'process.stdout.write(String(Math.floor(Date.now() / 1000)))')
          moved=$(( (shifted - real) / 86400 ))
          echo "clock moved ${moved} days"
          if [ "$moved" -ne 90 ]; then
            echo "fake-clock did not take — this job would pass vacuously"
            exit 1
          fi
      - name: Unit suite 90 days from now
        run: npm run test -- --run
        env:
          TROPOS_CLOCK_OFFSET_DAYS: 90
      # The server suite has its own expiring fixtures and does not go
      # through `run-unit-tests.mjs`, so the preload is named directly
      # here. Measured green at +90 days when this was added — but the
      # client half being clean would not have proved that, and the one
      # thing this whole exercise keeps demonstrating is that the copy
      # you measured is not the copy you were asking about. Running the
      # functions suite forward is also what turned up the `instanceof
      # Date` narrowing the preload now guards against.
      - run: npm ci
        working-directory: functions
      - name: Functions suite 90 days from now
        run: npm test
        working-directory: functions
        env:
          TROPOS_CLOCK_OFFSET_DAYS: 90
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/fake-clock.cjs

  # Order-independence gate (2026-09-18). The unit suite had only ever
  # run in WRITTEN order — file order and, inside each file, source
  # order. A test that passes only where it sits is not a test of the
  # code; it is a test of its neighbours. #2391 found three such files by
  # running `--sequence.shuffle` by hand and fixed them; it left two
  # behind, and a hand-run is not a gate, so nothing would have found
  # them again.
  #
  # All three survivors were global mutable state, and none was visible
  # in written order:
  #
  #   useHomeProgram.test.tsx        a mock-factory counter that a module
  #                                  registry runs ONCE per file, asserted
  #                                  as 0 then 1 — true only first.
  #   WorkoutSessionCompletion.tsx   a fake-timer block that left
  #                                  framer-motion's frame loop dead for
  #                                  the rest of the file, so five later
  #                                  `toBeVisible()` assertions saw
  #                                  `opacity: 0`.
  #   Coachmark.test.tsx             the same stall, in another file: an
  #                                  AnimatePresence exit that never ran,
  #                                  leaving a dismissed tooltip in the
  #                                  DOM. Found only because seed 5 runs
  #                                  the fake-timer test first.
  #
  # The last two are the argument for a second seed. Seed 23 finds the
  # first two files and not the third; seed 5 finds the third and not the
  # first. One order is a sample, not a gate.
  #
  # The seed is FIXED, so this job is deterministic: it pins two orders
  # rather than sampling a new one per run. A rotating seed would catch
  # more and would also redden an unrelated PR on a Tuesday, which is the
  # trade `check-race-dates.ts` already decided for this repo. Seed 23
  # and 5 are kept because between them they caught all three, and
  # neither caught all three alone.
  unit-shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [23, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # Prove the flag still DOES something, before trusting a green
      # suite — the `unit-locale` and `unit-future` jobs both learned
      # this the same way. Measured on vitest 4.1.8:
      # `--sequence.bogusOption=1` exits 0 and runs the suite normally,
      # so an unknown sequence key is accepted in silence. If
      # `--sequence.shuffle` were ever renamed, this job would keep
      # passing as a second copy of `unit`.
      #
      # `scripts/shuffleOrderProbe.test.ts` records its own execution
      # order from inside the run and writes it to a file. The first
      # version of this step grepped the verbose reporter's console
      # output instead: it worked locally, found NOTHING on the runner,
      # and — because it hid stderr — printed the same `<nothing>` for
      # "vitest never ran" as for "the orders matched". Hence a file,
      # and an explicit exit-status check on each run.
      - name: Confirm the shuffle took
        run: |
          set -o pipefail
          for seed in 23 5; do
            TROPOS_SHUFFLE_PROBE="$RUNNER_TEMP/order-$seed.txt" \
              npx vitest run --sequence.shuffle --sequence.seed="$seed" \
              scripts/shuffleOrderProbe.test.ts
            if [ ! -s "$RUNNER_TEMP/order-$seed.txt" ]; then
              echo "probe wrote nothing for seed $seed — vitest did not run"
              exit 1
            fi
          done
          echo "seed 23 order: $(tr '\n' ' ' < "$RUNNER_TEMP/order-23.txt")"
          echo "seed  5 order: $(tr '\n' ' ' < "$RUNNER_TEMP/order-5.txt")"
          if diff -q "$RUNNER_TEMP/order-23.txt" "$RUNNER_TEMP/order-5.txt" \
            >/dev/null; then
            echo "two seeds produced the SAME order — shuffle did not take,"
            echo "so this job would report order-independence it never examined"
            exit 1
          fi
      - name: Unit suite in shuffled order (seed ${{ matrix.seed }})
        run: npm run test -- --run --sequence.shuffle --sequence.seed=${{ matrix.seed }}

  # Dependency advisories, as a PR gate for the full ROOT tree: `npm audit`
  # fails on high or critical, so a new advisory has to be fixed or
  # consciously addressed before it merges. Development tooling processes
  # images too, so the root gate includes it. Both dependency
  # trees gate on high/critical. Compatible transitive updates cleared the
  # Functions high/critical advisories on 2026-09-07 without an Admin SDK
  # major migration; do not restore the former report-only `|| true` lane.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Audit root and development dependencies (gates on high and critical)
        run: npm audit --audit-level=high
      - name: Audit functions dependencies (gates on high and critical)
        working-directory: functions
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
