name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
  # Manual re-deploy escape hatch. If a deploy ever appears to have
  # gone green but didn't actually upload (the silent-stranded-deploy
  # bug from #655's root cause), `workflow_dispatch` lets an operator
  # force a fresh run without pushing a no-op commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # firebase-tools auto-enables the deploy-infra APIs (cloudfunctions,
      # cloudbuild, artifactregistry, firebaseextensions) but NOT Secret
      # Manager. The deploy resolves every bound secret (defineSecret:
      # APPLE_KEY_ID, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
      # BILLING_HMAC_SECRET, …) against Secret Manager during prep, so a
      # project where that API is disabled 403s on EVERY functions deploy.
      #
      # `gcloud services enable` returns once the enablement operation is
      # accepted, but a project's FIRST-EVER Secret Manager use has an extra
      # data-plane propagation lag ("API has not been used in project X
      # before … wait a few minutes to propagate"). The deploy in the same
      # job races ahead and still 403s. So after enabling we POLL the data
      # plane (a real `gcloud secrets list` call) until Secret Manager
      # actually answers, then let the deploy run.
      - name: Ensure Secret Manager API is enabled (and propagated)
        run: |
          set -euo pipefail
          PROJECT=adaptive-fitness-af8bb
          gcloud services enable secretmanager.googleapis.com --project "$PROJECT"
          for i in $(seq 1 24); do
            out=$(gcloud secrets list --project "$PROJECT" --limit=1 2>&1) && {
              echo "Secret Manager reachable (attempt $i)."; exit 0; }
            if echo "$out" | grep -qiE "has not been used|SERVICE_DISABLED|is disabled|SERVICE_DISABLED"; then
              echo "Waiting for Secret Manager to propagate (attempt $i)…"; sleep 15; continue
            fi
            # Any other response (e.g. a permissions error) means the API is
            # enabled and reachable — propagation is done, let the deploy run.
            echo "Secret Manager reachable (non-propagation response, attempt $i):"; echo "$out"; exit 0
          done
          echo "::warning::Secret Manager still not reachable after polling; deploy may 403."

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: cd functions && npm install

      # Inject the commit SHA + timestamp into functions/index.js
      # right before deploy. firebase-tools deduplicates uploads
      # against the deployed bundle hash; if no .js files changed in
      # this PR's diff vs the previous deploy, it skips the upload
      # and reports success even though production isn't updated.
      # That exact bug stranded R1A code (#648 / #652 / #653) in
      # main for 6 days while every CI run reported green — see
      # #655 for the forensic write-up.
      #
      # Prepending a per-commit unique marker line guarantees the
      # bundle hash differs from whatever's deployed, forcing
      # firebase-tools to upload a fresh bundle every time. The
      # marker is a single comment line; zero runtime impact.
      - name: Force unique bundle hash (prevent silent-stranded-deploys)
        run: |
          BUILD_SHA="${{ github.sha }}"
          BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sed -i "1i// CI build: ${BUILD_SHA} @ ${BUILD_TS}" functions/index.js
          echo "Injected build marker:"
          head -2 functions/index.js

      - name: Deploy functions
        run: firebase deploy --only functions --project adaptive-fitness-af8bb --force
