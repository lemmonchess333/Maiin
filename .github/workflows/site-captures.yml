name: Website captures (scratch)

# Scratch workflow on claude/site-captures only, never merged: runs the
# capture rig on the seeded demo accounts and commits the frames back to
# this branch, because the agent sandbox cannot download the Firestore
# emulator. The website's design PR takes its app screens from here.

on:
  push:
    branches: ["claude/site-captures"]

concurrency:
  group: site-captures
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    if: "!contains(github.event.head_commit.message, '[frames]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Install Chromium for Playwright
        timeout-minutes: 13
        run: bash scripts/ci/install-playwright-chromium.sh install 200
      - run: npm install -g firebase-tools@15.34.0
      - name: Build app with emulator wiring
        run: npm run build:e2e
        env:
          VITE_USE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: emulator-dummy-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-tropos.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-tropos
          VITE_FIREBASE_STORAGE_BUCKET: demo-tropos.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      - name: Capture
        continue-on-error: true
        env:
          E2E_AUTH_EMULATOR: "1"
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-tropos
        run: |
          firebase emulators:exec --only auth,firestore --project demo-tropos \
            'npm run seed:e2e && npm run seed:rich && npm run seed:circles && npm run seed:experience && npm run seed:fellbehind && npm run seed:liftreturn && npm run seed:season && npx playwright test -c playwright.site-captures.config.ts --project=auth-emulator --workers=1 --retries=0 e2e/screenshots/food-suggestions.screens.capture.spec.ts e2e/screenshots/food-delight.screens.capture.spec.ts e2e/screenshots/easier.screens.capture.spec.ts e2e/screenshots/analytics.screens.capture.spec.ts e2e/screenshots/nutrition-breakdown.screens.capture.spec.ts'
      - name: Commit the frames to this branch
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then echo "no frames"; exit 0; fi
          git config user.name "tropos-screenshot-bot"
          git config user.email "bot@tropos.local"
          mkdir -p site-frames/round2 && cp -r screenshots/. site-frames/round2/
          git add -f site-frames/round2/
          git commit -m "Website captures [frames] [skip ci]" || exit 0
          git push origin HEAD:claude/site-captures
