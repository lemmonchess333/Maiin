# Build the web bundle, sync it into the native iOS project, archive a
# signed Release build, and upload it to TestFlight.
#
# WHY THIS EXISTS
#   A push to `main` updates the GitHub Pages WEB build automatically, but
#   the native iOS app bundles its web assets at BUILD time (capacitor
#   `webDir: dist` → `cap sync ios`). So native never updates from a web
#   deploy — it only changes when an Xcode/TestFlight build runs. This
#   workflow IS that build, on a macOS runner, so native delivery stops
#   being a manual Mac chore.
#
# ⚠️ SCAFFOLD — NOT YET VERIFIED. This was authored in a Linux environment
#   with no macOS runner or Apple credentials, so it has never executed.
#   Before relying on it, an operator must (one-time):
#     1. Add the Apple signing secrets (see docs/ios-release.md). The
#        VITE_FIREBASE_* secrets the build step needs are the same ones
#        deploy.yml already uses, so they are almost certainly set.
#     2. Run it once via the Actions tab ("Run workflow") and fix any
#        signing/scheme specifics for this exact project.
#   It is `workflow_dispatch` ONLY (manual) on purpose — it will never fire
#   on push, so merging it changes nothing until you deliberately trigger it.
#
#   Four certain failures were removed from the scaffold by reading the
#   project it builds, before any run (2026-09-19): it archived a
#   `.xcworkspace` that does not exist (the project is SPM — there is only
#   `App.xcodeproj`), it shipped no `GoogleService-Info.plist` (every Firebase
#   plugin calls `FirebaseApp.configure()` at launch, which aborts without
#   one), it left the build number at 1 (App Store Connect refuses the second
#   upload), and it never registered the Google sign-in URL scheme (the
#   GoogleSignIn SDK raises without it). The first run is still a bring-up.
#
#   Four more, found the same way when the owner, who has no Mac, set out to
#   run it (2026-09-30): it ran on macos-14, a deprecated image; the project
#   signs automatically, which on a runner with no Apple account looks for a
#   development profile that will never exist; the export options named no
#   profile for the manual export; and the app declared none of the
#   entitlements Sign in with Apple and HealthKit need, so both would have
#   failed on the phone. Signing now switches the app targets to their
#   imported App Store profiles, and each profile is checked against the
#   certificate, the team and the app's entitlements before the archive.
#
# Canonical pattern: import a distribution cert + a provisioning profile for
# each app target into an ephemeral keychain, archive with xcodebuild, export
# an .ipa, upload with an App Store Connect API key. The targets come from
# the project (scripts/ios_signed_targets.py). The cert and the iPhone and
# Watch profiles are the owner's own when the IOS_DIST_CERT_* secrets are
# set; otherwise the run makes the cert and every profile from the API key
# (scripts/ios/asc-signing.mjs), so the API key, the team ID and the
# Firebase plist are all it needs. See docs/ios-release.md.

name: Deploy iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional What to Test note for this TestFlight build (a pilot's starts with the pilot line)"
        required: false
        default: ""
      connected_training_pilot:
        description: "Connected training pilot: Watch app and Health export on, its own tester group, never for release"
        type: boolean
        required: false
        default: false

run-name: TestFlight ${{ inputs.connected_training_pilot && 'connected training pilot' || 'standard' }} · ${{ github.ref_name }}

# Never run two TestFlight uploads at once (build numbers must be unique).
concurrency:
  group: ios-testflight
  cancel-in-progress: false

# Reads the repository and nothing else; it writes nothing with the token.
permissions:
  contents: read

jobs:
  testflight:
    # macos-14 is deprecated (actions/runner-images#13518). macos-26 carries
    # the current Xcode as its default, which is what App Store Connect
    # accepts uploads from; the Archive step prints the version it used.
    runs-on: macos-26
    # The first archive resolves every Swift package from scratch, and the
    # Firebase SDK alone is large. After the upload, a build that has notes
    # or a tester group waits up to 40 minutes for App Store Connect to
    # finish processing it.
    timeout-minutes: 110
    env:
      # ── App identity (match capacitor.config.ts appId) ──────────────
      # Non-secret only. SIGNING secrets stay scoped to the individual
      # steps that need them (2026-07-11 repo audit batch 5): job-level
      # secret env exposed every credential to `npm ci`'s dependency
      # lifecycle scripts, so `npm ci` still runs with none in scope.
      #
      # That audit moved the signing credentials off the job and the build
      # step never got its own env block back, so every build here ran with
      # NO VITE_* config at all — a TestFlight build with a blank Firebase
      # config, where every sign-in returns auth/internal-error. The build
      # step below now carries the client config explicitly. It is public
      # by design (it ships inside the bundle); the scoping rule is about
      # the signing material, which is still nowhere near npm.
      BUNDLE_ID: com.tropos.app
      WATCH_BUNDLE_ID: com.tropos.app.watchkitapp
      SCHEME: App

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One explicit dispatch choice makes a build standard or a pilot. A
      # standard build (the default, and the committed Release project)
      # keeps both halves of the gate off, embeds no Watch app and asks
      # Health for steps alone. The pilot turns the web gate on and passes
      # WATCH_RUN_RELEASE_ENABLED=YES to this archive, which project.pbxproj
      # turns into the native gate, the embedded Watch app and the expanded
      # Health usage text. A pilot is made only by hand, from this form: a
      # trigger added later (a tag, a schedule) can make standard builds only.
      - name: Select connected training build mode
        id: training-mode
        env:
          CONNECTED_TRAINING_PILOT: ${{ inputs.connected_training_pilot }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$CONNECTED_TRAINING_PILOT" in
            true)
              if [ "$EVENT_NAME" != workflow_dispatch ]; then
                echo "::error::A connected training pilot is made only from Run workflow, not from $EVENT_NAME."
                exit 1
              fi
              echo "web=true" >> "$GITHUB_OUTPUT"
              echo "native=YES" >> "$GITHUB_OUTPUT"
              echo "kind=pilot" >> "$GITHUB_OUTPUT"
              echo "Connected training pilot selected for this TestFlight build."
              ;;
            false|"")
              echo "web=false" >> "$GITHUB_OUTPUT"
              echo "native=NO" >> "$GITHUB_OUTPUT"
              echo "kind=standard" >> "$GITHUB_OUTPUT"
              echo "Standard TestFlight build; connected training remains off."
              ;;
            *) echo "::error::Unknown connected training build mode."; exit 1 ;;
          esac

      # Every app and extension target in the project is signed with its own
      # App Store profile. The list comes from project.pbxproj, so a target
      # added later (the Live Activity widget, docs/run-live-activity.md) is
      # signed and exported without editing this workflow, and a kind of
      # target the script does not know stops the run here, naming it.
      - name: List the targets to sign
        run: |
          set -euo pipefail
          python3 scripts/ios_signed_targets.py list \
            ios/App/App.xcodeproj/project.pbxproj "$RUNNER_TEMP/signed-targets.json" \
            --require "$BUNDLE_ID" --require "$WATCH_BUNDLE_ID"
          SIGNED_BUNDLE_IDS=$(python3 -c 'import json, sys; print(" ".join(t["bundle_id"] for t in json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/signed-targets.json")
          echo "SIGNED_BUNDLE_IDS=$SIGNED_BUNDLE_IDS" >> "$GITHUB_ENV"

      # Every secret this run needs, checked together before `npm ci` and a
      # 20-minute archive, so a missing one is named in the first minute and
      # all of them at once. This step runs no package code.
      - name: Check the signing secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID \
            ASC_API_KEY_P8_BASE64 IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. docs/ios-release.md says how to make each one, without a Mac."
            exit 1
          fi
          # Your own certificate and both profiles are optional: all four
          # secrets, or none, and then the run makes signing from the API key.
          own=0
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 IOS_WATCH_PROVISIONING_PROFILE_BASE64; do
            if [ -n "${!name}" ]; then own=$((own + 1)); fi
          done
          if [ "$own" -ne 0 ] && [ "$own" -ne 4 ]; then
            echo "::error::Only some of your own signing secrets are set. Set IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64 and IOS_WATCH_PROVISIONING_PROFILE_BASE64 together, or delete them all and the run makes signing from the API key."
            exit 1
          fi
          if [ "$own" -eq 4 ]; then
            echo "Signing with your own certificate and iPhone/Watch profiles: $SIGNED_BUNDLE_IDS."
          else
            echo "Signing from the API key: this run makes its own certificate and a profile for each of $SIGNED_BUNDLE_IDS."
          fi
          # A file's secret may hold the file's text as pasted, or its base64.
          write_secret_file() {
            case "$1" in
              *"-----BEGIN"*|*"<?xml"*|*"<plist"*) printf '%s\n' "$1" > "$2" ;;
              *) printf '%s' "$1" | tr -d '[:space:]' | base64 --decode > "$2" ;;
            esac
          }
          if ! write_secret_file "$ASC_API_KEY_P8_BASE64" "$RUNNER_TEMP/check.p8" 2>/dev/null \
            || ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/check.p8"; then
            rm -f "$RUNNER_TEMP/check.p8"
            echo "::error::ASC_API_KEY_P8_BASE64 is not an App Store Connect key. Paste the whole .p8 file's text (it starts with -----BEGIN PRIVATE KEY-----), or its base64."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/check.p8"
          # Every step strips whitespace from these, so a secret pasted with a
          # trailing newline still works.
          if ! [[ "$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID should be the 10-character Team ID from Apple Developer → Membership details, with nothing around it."
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      # Where the build will go, checked before 20 minutes of archive: a
      # pilot needs its own internal group, and no other internal group may
      # receive every build automatically, or the pilot would reach it too.
      # Runs only repository code with no packages, so it can go before npm ci.
      - name: Check the TestFlight tester group
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          BUILD_KIND: ${{ steps.training-mode.outputs.kind }}
          TESTFLIGHT_NOTES: ${{ inputs.notes }}
          TESTFLIGHT_PILOT_GROUP_ID: ${{ vars.TESTFLIGHT_PILOT_GROUP_ID }}
          TESTFLIGHT_STANDARD_GROUP_ID: ${{ vars.TESTFLIGHT_STANDARD_GROUP_ID }}
        run: |
          set -euo pipefail
          # A file's secret may hold the file's text as pasted, or its base64.
          write_secret_file() {
            case "$1" in
              *"-----BEGIN"*|*"<?xml"*|*"<plist"*) printf '%s\n' "$1" > "$2" ;;
              *) printf '%s' "$1" | tr -d '[:space:]' | base64 --decode > "$2" ;;
            esac
          }
          KEY="$RUNNER_TEMP/testflight-check.p8"
          trap 'rm -f "$KEY"' EXIT
          write_secret_file "$ASC_API_KEY_P8_BASE64" "$KEY"
          ASC_API_KEY_PATH="$KEY" node scripts/ios/testflight-build.mjs check

      - name: Install deps
        run: npm ci

      # The bridge instantiates every plugin at launch (CapacitorBridge
      # .registerPlugins → plugin.load), and the three @capacitor-firebase
      # plugins each call FirebaseApp.configure() when no app is configured
      # yet. configure() aborts the process when the bundle carries no
      # GoogleService-Info.plist — so a build without it archives, uploads,
      # installs, and dies before the first frame. The file is not in git
      # (ios/.gitignore); it arrives from a secret. The Xcode project
      # references it in the Resources phase, so if this step is skipped the
      # archive fails naming the file instead of a tester's phone crashing.
      - name: Place GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set. Firebase Console → Project settings → Your apps → iOS app → download GoogleService-Info.plist, then paste the file's text (or its base64) into a repo secret of that name. Without it the app crashes at launch."
            exit 1
          fi
          # A file's secret may hold the file's text as pasted, or its base64.
          write_secret_file() {
            case "$1" in
              *"-----BEGIN"*|*"<?xml"*|*"<plist"*) printf '%s\n' "$1" > "$2" ;;
              *) printf '%s' "$1" | tr -d '[:space:]' | base64 --decode > "$2" ;;
            esac
          }
          PLIST=ios/App/App/GoogleService-Info.plist
          write_secret_file "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" "$PLIST"
          plutil -lint "$PLIST"
          PLIST_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$PLIST")
          if [ "$PLIST_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "::error::GoogleService-Info.plist is for $PLIST_BUNDLE_ID, not $BUNDLE_ID — that is a different Firebase iOS app."
            exit 1
          fi

      # GoogleSignIn raises an NSException from signIn(withPresenting:) when
      # the app declares no URL scheme for its REVERSED_CLIENT_ID, so without
      # this "Continue with Google" would crash rather than fail. The value
      # lives in the plist just placed; derive it rather than commit it. A
      # local Xcode build still needs it added by hand (docs/ios-release.md).
      - name: Register the Google sign-in URL scheme
        run: |
          set -euo pipefail
          INFO=ios/App/App/Info.plist
          GSI=ios/App/App/GoogleService-Info.plist
          if ! REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GSI" 2>/dev/null); then
            echo "::error::GoogleService-Info.plist has no REVERSED_CLIENT_ID — the Firebase iOS app has no OAuth client, so Google sign-in cannot work on this build. Firebase Console → Authentication → Sign-in method → Google → enable, then re-download the plist."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$INFO" >/dev/null 2>&1; then
            echo "Info.plist already declares CFBundleURLTypes — leaving it as committed."
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$INFO"
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$INFO"

      # Fail here rather than 40 minutes later in Xcode, and long before a
      # tester installs a build that cannot sign anyone in. deploy.yml and
      # deploy-hosting.yml both run this guard; this workflow was the one
      # that did not.
      - name: Check Firebase web config is present
        run: node scripts/check-web-env.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # `build:ios`, not `build`. Plain `npm run build` leaves CAPACITOR_BUILD
      # unset, so vite.config resolves `base` to "/Maiin/" — the GitHub Pages
      # path — and inside the native shell, which serves from the bundle root,
      # every asset URL points at a directory that does not exist. The app
      # compiles, archives, uploads, and opens on a white screen.
      #
      # build:ios sets the flag and runs `cap sync ios` itself, so it replaces
      # both steps this used to have and there is one definition of how an iOS
      # bundle gets made, shared with the local command in the README.
      - name: Build web bundle and sync into the iOS project
        run: npm run build:ios
        env:
          VITE_CONNECTED_TRAINING_ENABLED: ${{ steps.training-mode.outputs.web }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Parity with the web deploy — the Pro-gated road-align layer is
          # not a web-only feature.
          VITE_ROUTE_PLANNING_ENABLED: "true"
          #
          # Absent on purpose, so nobody has to re-derive why:
          #
          #   VITE_FIREBASE_MEASUREMENT_ID — web Analytics SDK only; the
          #     native shell reads GoogleService-Info.plist, placed above.
          #   VITE_FIREBASE_VAPID_KEY — FCM *web* push; native push is APNs.
          #   VITE_RECAPTCHA_V3_SITE_KEY — the web App Check provider.
          #     appCheck.ts takes its isNativePlatform() branch before it ever
          #     reads the key, so passing it here would do nothing and imply
          #     native attestation is configured when it is not.
          #   VITE_REVENUECAT_IOS_KEY — NOT wired, deliberately. Adding the
          #     line arms RevenueCat the instant the GitHub secret exists, and
          #     purchaseProvider routes iOS through it with no further gate.
          #     Add it only after the activation order in
          #     docs/iap/revenuecat-setup.md is complete, or a purchase is
          #     taken by Apple and no entitlement is written.

      # Both failures above are invisible in a green build: the bundle
      # compiles either way and only misbehaves on a device, by which point
      # it has cost a 40-minute archive and a TestFlight round trip. Assert
      # them while they are still cheap.
      - name: Verify the bundle is a Capacitor build
        run: |
          set -euo pipefail
          if grep -Eq '(src|href)="/Maiin/' dist/index.html; then
            echo "::error::dist/index.html references /Maiin/ — built without CAPACITOR_BUILD=true. The native shell serves from the bundle root, so those assets resolve to nothing and the app opens blank."
            exit 1
          fi
          if [ ! -f ios/App/App/public/index.html ]; then
            echo "::error::cap sync did not populate ios/App/App/public — the archive would ship whatever web assets were there before, or none."
            exit 1
          fi

      # Without the owner's own certificate secrets, the run makes its
      # signing from the API key: a private key and certificate request made
      # here, then an Apple Distribution certificate and an App Store profile
      # for each signed target from App Store Connect's API
      # (scripts/ios/asc-signing.mjs, reading SIGNED_BUNDLE_IDS). The key
      # never leaves this runner, so every run makes a new certificate, and
      # the script revokes the one the run before made. The import step
      # below checks the result just as it checks the owner's own.
      #
      # /usr/bin/openssl is macOS's own LibreSSL, and the .p12 takes the older
      # encryption macOS's `security` imports; OpenSSL 3's default can fail
      # there with "MAC verification failed" (docs/ios-release.md).
      - name: Make the signing certificate and profiles from the API key
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ]; then
            echo "Your own certificate secrets are set, so this run signs with them."
            exit 0
          fi
          # A file's secret may hold the file's text as pasted, or its base64.
          write_secret_file() {
            case "$1" in
              *"-----BEGIN"*|*"<?xml"*|*"<plist"*) printf '%s\n' "$1" > "$2" ;;
              *) printf '%s' "$1" | tr -d '[:space:]' | base64 --decode > "$2" ;;
            esac
          }
          OUT="$RUNNER_TEMP/api-signing"
          mkdir -p "$OUT"
          write_secret_file "$ASC_API_KEY_P8_BASE64" "$OUT/AuthKey.p8"
          /usr/bin/openssl genrsa -out "$OUT/dist.key" 2048
          /usr/bin/openssl req -new -key "$OUT/dist.key" -out "$OUT/dist.csr" \
            -subj "/CN=Tropos CI/C=GB"
          ASC_API_KEY_PATH="$OUT/AuthKey.p8" node scripts/ios/asc-signing.mjs "$OUT/dist.csr" "$OUT"
          /usr/bin/openssl x509 -inform DER -in "$OUT/dist.cer" -out "$OUT/dist.pem"
          /usr/bin/openssl rand -hex 16 | tr -d '\n' > "$OUT/p12-password"
          /usr/bin/openssl pkcs12 -export -inkey "$OUT/dist.key" -in "$OUT/dist.pem" \
            -name "Tropos CI" -out "$RUNNER_TEMP/dist-cert.p12" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -passout "file:$OUT/p12-password"
          mkdir -p "$RUNNER_TEMP/profiles"
          cp "$OUT"/profiles/*.mobileprovision "$RUNNER_TEMP/profiles/"
          rm -f "$OUT/dist.key" "$OUT/AuthKey.p8"

      # The owner has no Mac, so their own certificate comes from a CSR made
      # with openssl and the iPhone and Watch profiles from Apple's website,
      # or the step above makes the certificate and every profile
      # (docs/ios-release.md). They can be wrong in a way that only shows 20
      # minutes into the archive, so check them here. Each signed target's
      # profile must match its team, bundle ID, distribution type, expiry and
      # entitlements, and every profile must name the certificate.
      - name: Import signing certificate + provisioning profiles
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          export PROFILES="$RUNNER_TEMP/profiles"
          mkdir -p "$PROFILES"
          # The keychain lives for this job only, so its password is made
          # here rather than kept as a secret.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          export APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')

          if [ -f "$RUNNER_TEMP/api-signing/p12-password" ]; then
            # Made from the API key in the step above, already in place.
            CERT_SOURCE="The certificate this run made from the API key"
            IOS_DIST_CERT_PASSWORD=$(cat "$RUNNER_TEMP/api-signing/p12-password")
          else
            CERT_SOURCE="IOS_DIST_CERT_P12_BASE64"
            IOS_DIST_CERT_PASSWORD=$(printf '%s' "$IOS_DIST_CERT_PASSWORD" | tr -d '\r\n')
            printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$CERT_PATH"
            printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILES/$BUNDLE_ID.mobileprovision"
            printf '%s' "$IOS_WATCH_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILES/$WATCH_BUNDLE_ID.mobileprovision"
          fi
          for bundle in $SIGNED_BUNDLE_IDS; do
            if [ ! -f "$PROFILES/$bundle.mobileprovision" ]; then
              echo "::error::The project also signs $bundle, and your own signing secrets hold profiles for $BUNDLE_ID and $WATCH_BUNDLE_ID only. Delete IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD and both profile secrets, and the run makes every profile from the API key (docs/ios-release.md)."
              exit 1
            fi
            if ! security cms -D -i "$PROFILES/$bundle.mobileprovision" > "$PROFILES/$bundle.plist"; then
              echo "::error::The provisioning profile for $bundle does not decode. Its secret should be the base64 of the App Store .mobileprovision file."
              exit 1
            fi
          done

          # Presence alone is insufficient: a development APNs profile cannot
          # receive TestFlight pushes. Fail with setup instructions before Xcode.
          python3 scripts/verify_ios_push.py --profile "$PROFILES/$BUNDLE_ID.plist"

          python3 - <<'PY'
          import datetime, hashlib, json, os, plistlib, sys

          profiles = os.environ["PROFILES"]
          team = os.environ["APPLE_TEAM_ID"]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "signed-targets.json")) as f:
              targets = json.load(f)
          problems = []
          uuids = {}
          for target in targets:
              bundle = target["bundle_id"]
              with open(os.path.join(profiles, bundle + ".plist"), "rb") as f:
                  profile = plistlib.load(f)
              wanted = {}
              if target["entitlements"]:
                  with open(target["entitlements"], "rb") as f:
                      wanted = plistlib.load(f)
              have = profile.get("Entitlements", {})
              app_id = have.get("application-identifier", "")
              if not app_id.endswith("." + bundle):
                  problems.append(f"{bundle}: profile is for {app_id}")
              if team not in profile.get("TeamIdentifier", []):
                  problems.append(f"{bundle}: profile belongs to team {profile.get('TeamIdentifier')}, not {team}")
              if "ProvisionedDevices" in profile or have.get("get-task-allow"):
                  problems.append(f"{bundle}: expected an App Store profile, not development or ad hoc")
              now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
              if profile["ExpirationDate"] < now:
                  problems.append(f"{bundle}: profile expired on {profile['ExpirationDate']:%Y-%m-%d}")
              mismatched = sorted(key for key, value in wanted.items() if have.get(key) != value)
              if mismatched:
                  problems.append(
                      f"{bundle}: profile lacks matching " + ", ".join(mismatched)
                      + ". Turn on those App ID capabilities in Apple Developer → Identifiers and regenerate the profile"
                  )
              print(f"Profile for {bundle}: {profile['Name']} ({profile['UUID']}), expires {profile['ExpirationDate']:%Y-%m-%d}")
              uuids[bundle] = profile["UUID"]
              with open(os.path.join(profiles, bundle + ".uuid"), "w") as out:
                  out.write(profile["UUID"] + "\n")
              with open(os.path.join(profiles, bundle + ".certificates"), "w") as out:
                  for der in profile.get("DeveloperCertificates", []):
                      out.write(hashlib.sha1(der).hexdigest().upper() + "\n")
          for problem in problems:
              print(f"::error::The provisioning profile is wrong: {problem}.")
          if problems:
              sys.exit(1)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "profile-uuids.json"), "w") as out:
              json.dump(uuids, out, indent=2)
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple's intermediate, so the chain still validates if the image
          # ever stops carrying it.
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; then
            security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -A || true
          fi
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$IDENTITIES"
          CERT_SHA1=$(echo "$IDENTITIES" | awk '/"(Apple|iPhone) Distribution/ {print $2; exit}')
          if [ -z "$CERT_SHA1" ]; then
            echo "::error::$CERT_SOURCE holds no valid Apple Distribution identity. The certificate must be an Apple Distribution certificate made from the private key that went into the .p12."
            exit 1
          fi
          for bundle in $SIGNED_BUNDLE_IDS; do
            if ! grep -qx "$CERT_SHA1" "$PROFILES/$bundle.certificates"; then
              echo "::error::The provisioning profile for $bundle was made for a different certificate. Edit the profile on Apple's site, tick the certificate in this .p12, download it again and update its secret."
              exit 1
            fi
          done

          # Xcode 16 moved where it reads profiles from, so install in both.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            for bundle in $SIGNED_BUNDLE_IDS; do
              cp "$PROFILES/$bundle.mobileprovision" "$dir/$(cat "$PROFILES/$bundle.uuid").mobileprovision"
            done
          done

      # Switch every signed target, in every configuration, to its imported
      # profile in the project file. A command-line
      # PROVISIONING_PROFILE_SPECIFIER would also reach Swift package
      # targets, where Xcode rejects it.
      - name: Sign every app target with its App Store profile
        run: |
          set -euo pipefail
          python3 scripts/ios_signed_targets.py sign \
            ios/App/App.xcodeproj/project.pbxproj "$RUNNER_TEMP/profile-uuids.json"
          grep -n -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER' \
            ios/App/App.xcodeproj/project.pbxproj

      # `-project`, not `-workspace`: there is no ios/App/App.xcworkspace. The
      # project consumes Capacitor and every plugin through the local Swift
      # package `CapApp-SPM` (Package.swift is regenerated by `cap sync`), and
      # `cap build ios` archives an SPM project exactly this way.
      #
      # MARKETING_VERSION / CURRENT_PROJECT_VERSION override the `1.0` / `1`
      # the project file pins. App Store Connect refuses an upload whose build
      # number is not higher than the last one, so the second run of this
      # workflow would fail at upload with the values as committed; the run
      # number only ever increases. The marketing version comes from
      # package.json so the App Store listing and Settings → Support
      # (`__APP_VERSION__`) say the same thing.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WATCH_RUN_RELEASE_ENABLED: ${{ steps.training-mode.outputs.native }}
        run: |
          set -euo pipefail
          APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          if [ "$WATCH_RUN_RELEASE_ENABLED" != YES ] && [ "$WATCH_RUN_RELEASE_ENABLED" != NO ]; then
            echo "::error::The native connected training gate is not YES or NO."
            exit 1
          fi
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "Archiving $APP_VERSION ($GITHUB_RUN_NUMBER)"
          # The two -skip flags stop xcodebuild refusing a package's plugin
          # or macro for want of a person to approve it, which on a CI runner
          # never comes.
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            WATCH_RUN_RELEASE_ENABLED="$WATCH_RUN_RELEASE_ENABLED" \
            clean archive

      # A Watch app or extension target without SKIP_INSTALL installs beside
      # App.app in the archive, and the export then sees no single iOS app.
      - name: Verify archived iPhone and Watch signing
        run: |
          set -euo pipefail
          ARCHIVED_APPS=$(ls "$RUNNER_TEMP/App.xcarchive/Products/Applications")
          if [ "$ARCHIVED_APPS" != "App.app" ]; then
            echo "::error::The archive should hold App.app alone, but holds: $ARCHIVED_APPS. Set SKIP_INSTALL = YES on every embedded target."
            exit 1
          fi
          python3 scripts/verify_ios_push.py \
            --app "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
            --bundle-id "$BUNDLE_ID"
          python3 scripts/verify_ios_watch.py \
            --app "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
            --bundle-id "$WATCH_BUNDLE_ID" --companion-id "$BUNDLE_ID" \
            --expected-connected-training "${{ steps.training-mode.outputs.native }}"

      # A manual export needs a profile for each signed bundle in the
      # archive; without one it stops at "no profiles for com.tropos.app".
      # The map names what the archive holds, so a standard build's names no
      # Watch profile, and a bundle with no profile fails here by name. The
      # build number comes from the Archive step, so Xcode is told not to
      # manage it, which it would otherwise try to do by contacting App
      # Store Connect with credentials this step does not have.
      - name: Export .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          python3 scripts/ios_signed_targets.py export-options \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
            "$RUNNER_TEMP/profile-uuids.json" "$APPLE_TEAM_ID" \
            "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # Export may re-sign the app, so inspect the uploaded artifact as well as
      # the archive. Upload uses this exact verified path, never another IPA.
      - name: Verify exported iPhone and Watch signing
        run: |
          set -euo pipefail
          IPAS=("$RUNNER_TEMP"/export/*.ipa)
          if [ "${#IPAS[@]}" -ne 1 ] || [ ! -f "${IPAS[0]}" ]; then
            echo "::error::Expected exactly one exported IPA to verify and upload."
            exit 1
          fi
          IPA="${IPAS[0]}"
          VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/ios-push-verify.XXXXXX")
          ditto -x -k "$IPA" "$VERIFY_DIR"
          APPS=("$VERIFY_DIR"/Payload/*.app)
          if [ "${#APPS[@]}" -ne 1 ] || [ ! -d "${APPS[0]}" ]; then
            echo "::error::Expected exactly one app in the exported IPA."
            exit 1
          fi
          python3 scripts/verify_ios_push.py --app "${APPS[0]}" --bundle-id "$BUNDLE_ID"
          python3 scripts/verify_ios_watch.py --app "${APPS[0]}" \
            --bundle-id "$WATCH_BUNDLE_ID" --companion-id "$BUNDLE_ID" \
            --expected-connected-training "${{ steps.training-mode.outputs.native }}"
          echo "VERIFIED_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        id: upload
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          ASC_API_KEY_ID=$(printf '%s' "$ASC_API_KEY_ID" | tr -d '[:space:]')
          ASC_API_ISSUER_ID=$(printf '%s' "$ASC_API_ISSUER_ID" | tr -d '[:space:]')
          # A file's secret may hold the file's text as pasted, or its base64.
          write_secret_file() {
            case "$1" in
              *"-----BEGIN"*|*"<?xml"*|*"<plist"*) printf '%s\n' "$1" > "$2" ;;
              *) printf '%s' "$1" | tr -d '[:space:]' | base64 --decode > "$2" ;;
            esac
          }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          write_secret_file "$ASC_API_KEY_P8_BASE64" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app -f "$VERIFIED_IPA" -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      # A pilot's "What to Test" says it is a pilot, and it goes to the pilot
      # group alone; a standard build carries the dispatch's notes and goes
      # to TESTFLIGHT_STANDARD_GROUP_ID when that is set. The notes reach the
      # script through the environment, never pasted into the command. For a
      # pilot every App Store Connect call passes through a guard that
      # refuses submission for review or release (testflight-build.mjs).
      - name: Mark the TestFlight build and send it to its group
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          BUILD_KIND: ${{ steps.training-mode.outputs.kind }}
          TESTFLIGHT_NOTES: ${{ inputs.notes }}
          TESTFLIGHT_PILOT_GROUP_ID: ${{ vars.TESTFLIGHT_PILOT_GROUP_ID }}
          TESTFLIGHT_STANDARD_GROUP_ID: ${{ vars.TESTFLIGHT_STANDARD_GROUP_ID }}
        run: |
          set -euo pipefail
          # A file's secret may hold the file's text as pasted, or its base64.
          write_secret_file() {
            case "$1" in
              *"-----BEGIN"*|*"<?xml"*|*"<plist"*) printf '%s\n' "$1" > "$2" ;;
              *) printf '%s' "$1" | tr -d '[:space:]' | base64 --decode > "$2" ;;
            esac
          }
          KEY="$RUNNER_TEMP/testflight-distribute.p8"
          trap 'rm -f "$KEY"' EXIT
          write_secret_file "$ASC_API_KEY_P8_BASE64" "$KEY"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION=$(node -p "require('./package.json').version") \
            ASC_API_KEY_PATH="$KEY" \
            node scripts/ios/testflight-build.mjs distribute

      # Crashlytics reads a native crash through the build's symbol files. A
      # local Xcode build uploads them from a run-script phase; this archive
      # is built on a runner, so they go up here, from the archive just sent
      # to TestFlight. After that upload, so a failure here turns the run red
      # without keeping the build from testers, and whatever the step before
      # did, so a slow App Store Connect does not cost the symbols.
      - name: Upload Crashlytics symbol files
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        run: |
          set -euo pipefail
          UPLOAD=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols' \
            -type f | head -n 1)
          if [ -z "$UPLOAD" ]; then
            echo "::error::upload-symbols not found; did the archive resolve FirebaseCrashlytics?"
            exit 1
          fi
          "$UPLOAD" -gsp ios/App/App/GoogleService-Info.plist -p ios \
            "$RUNNER_TEMP/App.xcarchive/dSYMs"

      # The runner is thrown away after the job, but the signing key should
      # not outlive the steps that needed it.
      - name: Remove the signing keychain and key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist-cert.p12" "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
          rm -rf "$RUNNER_TEMP/api-signing"
