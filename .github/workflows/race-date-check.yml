name: Refresh race dates

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: race-events-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The production environment holds the release credentials: only a
    # job that names it can read its secrets, and its branch rule decides
    # where such a job may run. Repository secrets still reach this job.
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser for JavaScript organiser pages
        # A stalled apt mirror hangs apt-get with no error. The script bounds
        # each attempt, tries three times, and clears dpkg's lock between
        # attempts; this limit covers its worst case.
        timeout-minutes: 13
        run: bash scripts/ci/install-playwright-chromium.sh install 200
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Refresh lapsed race dates from reviewed sources
        run: npm run races:refresh -- --apply
      - name: Keep one issue for sources needing attention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { results } = require('./race-date-report.json');
            const marker = '<!-- race-date-check -->';
            const review = results.filter(r => r.status === 'review');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (!review.length) {
              if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
              return;
            }
            const clean = s => String(s).replace(/[|\r\n]/g, ' ');
            const body = [marker,
              'These race-date sources need attention. The daily job will retry; races remain visible with “Next date TBA”. No guessed dates are published.',
              '', '| Race | Last confirmed date | Reason | Source |', '| --- | --- | --- | --- |',
              ...review.map(r => `| ${clean(r.name)} | ${r.current} | ${clean(r.detail)} | [Date source](${r.sourceUrl}) |`),
              '', 'Update the dedicated selector in `scripts/races/sources.ts`, or verify the date and update `spaceDefs.ts`. A reviewed bundled-date change supersedes an automated value.'
            ].join('\n');
            const title = 'Race date sources need attention';
            if (existing) {
              if (existing.body !== body || existing.title !== title) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, title, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
      - name: Save date audit in the run summary
        if: always()
        run: |
          if [ -f race-date-report.json ]; then
            echo '### Race date audit' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat race-date-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
