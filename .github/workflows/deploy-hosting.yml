name: Deploy to Firebase Hosting

# Serves the web app from Firebase Hosting (PROJECT.web.app /
# PROJECT.firebaseapp.com). Unlike the GitHub Pages deploy, Hosting puts the
# app on the SAME origin as the Firebase auth handler
# (PROJECT.firebaseapp.com/__/auth/handler), which is what makes OAuth sign-in
# (Apple / Google popup) work on iOS Safari — a cross-origin popup from
# github.io is severed by Safari's tracking protection (auth/internal-error).
#
# Setup (one-time, operator):
#   1. Add the FIREBASE_SERVICE_ACCOUNT repo secret — a service-account JSON
#      with the "Firebase Hosting Admin" role. Generate via:
#      Firebase Console → Project settings → Service accounts → Generate new
#      private key, OR `firebase init hosting:github` which creates it for you.
#   2. The VITE_FIREBASE_* secrets are already set (shared with deploy.yml).
#   3. Share the https://<project>.firebaseapp.com link with testers — that
#      domain is same-origin with the auth handler, so popup sign-in works.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "firebase-hosting"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # Same secret guard as the Pages deploy — fail loudly rather than ship a
      # blank Firebase config where every sign-in returns auth/internal-error.
      - run: node scripts/check-web-env.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # Root-based, same-origin bundle (base "/" instead of "/Maiin/").
      - run: npm run build:hosting
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V3_SITE_KEY }}
      # Deploy guard: never publish an E2E (mode=test) bundle to production.
      - name: Block accidental E2E bundle deploy
        run: |
          if grep -Rq "TROPOS_E2E_BUILD_DO_NOT_DEPLOY" dist; then
            echo "::error::Refusing to deploy an E2E build to Hosting"
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: adaptive-fitness-af8bb
          channelId: live
