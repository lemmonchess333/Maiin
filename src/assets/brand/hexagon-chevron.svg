<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Tropos hexagon-chevron mark">
  <!--
    The Tropos hexagon and upward chevron as line art, the geometry the
    in-app EmptyState primitive draws (src/components/ui/EmptyState.tsx:
    HEX_POINTS / CHEVRON). Not wired into any surface. Stroke uses
    currentColor so callers theme it.

    It is not the brand mark. The mark itself (the app icon, the launch
    image, Home's header) is src/assets/brand/app-icon.svg and
    src/lib/brandMark.ts (docs/visual-audit/bakeoff/DECISION.md,
    decision 4).
  -->
  <polygon points="50,6 89,28 89,72 50,94 11,72 11,28"
           stroke="currentColor" stroke-width="6"
           stroke-linejoin="round" stroke-linecap="round" />
  <polyline points="34,58 50,40 66,58"
            stroke="currentColor" stroke-width="6"
            stroke-linejoin="round" stroke-linecap="round" />
</svg>
