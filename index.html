<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7C6EF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tropos" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://js.stripe.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://basemaps.cartocdn.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.appspot.com https://*.googleapis.com https://basemaps.cartocdn.com https://*.cartocdn.com;
      connect-src 'self'
        https://*.googleapis.com
        https://*.firebaseio.com
        https://*.firebaseapp.com
        https://*.appspot.com
        https://*.cloudfunctions.net
        https://world.openfoodfacts.org
        https://api.open-meteo.com
        https://basemaps.cartocdn.com
        https://*.cartocdn.com
        https://raw.githubusercontent.com
        https://js.stripe.com
        https://api.stripe.com
        wss://*.firebaseio.com;
      frame-src https://js.stripe.com https://*.firebaseapp.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
    " />
    <meta name="description" content="The fitness app for hybrid athletes who lift and run. Smart training programmes, nutrition tracking, and performance analytics." />

    <!-- Open Graph -->
    <meta property="og:title" content="Tropos — Adaptive Fitness" />
    <meta property="og:description" content="The fitness app for hybrid athletes who lift and run. Smart training programmes, nutrition tracking, and performance analytics." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/Maiin/icons/icon-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tropos — Adaptive Fitness" />
    <meta name="twitter:description" content="Smart training programmes, nutrition tracking, and performance analytics for hybrid athletes." />
    <meta name="twitter:image" content="/Maiin/icons/icon-512x512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Maiin/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/Maiin/icons/icon-192x192.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firebaseio.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- Plus Jakarta Sans — variable weight 400..800 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <!-- JetBrains Mono — for numeric stats (precision feel) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&display=swap" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/Maiin/manifest.json" />

    <title>Tropos</title>
    <script>
      (function(){
        var d = localStorage.getItem('tropos-dark-mode');
        if (d === 'true' || (d === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        // GitHub Pages SPA redirect: restore route from query string set by 404.html
        (function(l) {
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          }
        }(window.location));
      })();
    </script>
  </head>
  <body>
    <noscript><div style="padding:2rem;text-align:center">Please enable JavaScript to use Tropos.</div></noscript>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:text-sm">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
