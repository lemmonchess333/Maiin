<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tropos" />
    <meta name="description" content="Track your fitness progress, crush your goals" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Maiin/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/Maiin/icons/icon-192x192.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebaseio.com" crossorigin />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/Maiin/manifest.json" />

    <title>Tropos</title>
    <script>
      (function(){
        var d = localStorage.getItem('tropos-dark-mode');
        if (d === 'true' || (d === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        // GitHub Pages SPA redirect: restore route from query string set by 404.html
        (function(l) {
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          }
        }(window.location));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
