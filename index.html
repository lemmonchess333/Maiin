<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7C6EF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tropos" />

    <!-- Content Security Policy
         2026-05-26 audit PR 4 (finding #9) — `'unsafe-inline'` dropped
         from `script-src`. The pre-React dark-mode init + GH Pages
         SPA redirect script moved out of an inline <script> block
         (see public/init.js, loaded synchronously below). Inline
         <style> is still permitted because Tailwind / Vite inject
         critical CSS inline at build time; tightening that is a
         larger refactor with its own trade-offs.

         Firebase Analytics (web) needs Google's gtag domains: it loads
         gtag.js from www.googletagmanager.com (script-src) and beacons
         hits to *.google-analytics.com / *.analytics.google.com
         (connect-src + img-src). Without these the browser silently
         blocks all analytics delivery. Native iOS analytics doesn't
         touch the web CSP (it goes through the native SDK). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' https://js.stripe.com https://www.googletagmanager.com https://apis.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://basemaps.cartocdn.com;
      font-src 'self';
      img-src 'self' data: blob: https://*.appspot.com https://*.googleapis.com https://basemaps.cartocdn.com https://*.cartocdn.com https://www.google-analytics.com https://www.googletagmanager.com;
      connect-src 'self'
        https://*.googleapis.com
        https://*.firebaseio.com
        https://*.firebaseapp.com
        https://*.appspot.com
        https://*.cloudfunctions.net
        https://world.openfoodfacts.org
        https://api.open-meteo.com
        https://basemaps.cartocdn.com
        https://*.cartocdn.com
        https://raw.githubusercontent.com
        https://js.stripe.com
        https://api.stripe.com
        https://www.google-analytics.com
        https://*.google-analytics.com
        https://*.analytics.google.com
        https://www.googletagmanager.com
        https://apis.google.com
        https://accounts.google.com
        wss://*.firebaseio.com;
      frame-src https://js.stripe.com https://*.firebaseapp.com https://apis.google.com https://accounts.google.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
    "
    />
    <meta
      name="description"
      content="The fitness app for hybrid athletes who lift and run. Smart training programmes, nutrition tracking, and performance analytics."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Tropos — Adaptive Fitness" />
    <meta
      property="og:description"
      content="The fitness app for hybrid athletes who lift and run. Smart training programmes, nutrition tracking, and performance analytics."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%icons/icon-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tropos — Adaptive Fitness" />
    <meta
      name="twitter:description"
      content="Smart training programmes, nutrition tracking, and performance analytics for hybrid athletes."
    />
    <meta name="twitter:image" content="%BASE_URL%icons/icon-512x512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192x192.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://firebaseio.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- Plus Jakarta Sans (text) + Archivo (numbers — replaced JetBrains Mono
         in the brand bake-off) are self-hosted (no Google Fonts CDN). The
         @fontsource-variable/* packages are imported in
         src/main.tsx and bundled by Vite as hashed, same-origin .woff2
         assets; @font-face is emitted with the "… Variable" family names
         referenced in src/index.css. Self-hosting removes the third-party
         request that leaked the user's IP to Google on every load and lets
         the service worker cache the fonts for offline. Variable wght axis
         (400–800 used today), latin subset fetched on demand via
         unicode-range. -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <title>Tropos</title>
    <!-- Pre-React boot (dark-mode synchronous apply + GH Pages SPA redirect).
         External file because audit PR 4 dropped `'unsafe-inline'` from
         `script-src`. Loaded synchronously (no async/defer) to preserve
         before-paint behaviour.

         Uses Vite's `%BASE_URL%` (→ `/Maiin/` for web prod, `/` for dev +
         Capacitor) rather than a relative `./init.js`. A relative path
         resolves against the *current* document URL, so a deep-link hard
         load (e.g. /Maiin/user/123) — increasingly common now the service
         worker serves index.html for deep navigations — requested
         /Maiin/user/123/init.js, got the SPA HTML fallback, and threw
         "Unexpected token '<'". The base-absolute path is route-depth
         independent. -->
    <script src="%BASE_URL%init.js"></script>
  </head>
  <body>
    <noscript
      ><div style="padding: 2rem; text-align: center">
        Please enable JavaScript to use Tropos.
      </div></noscript
    >
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:text-sm"
      >Skip to main content</a
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
